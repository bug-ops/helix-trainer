# Yank (Copy) and Paste Operations
# Scenarios covering clipboard operations

[[scenarios]]
id = "yank_paste_001"
name = "Copy and paste character"
description = "Yank (copy) a character and paste it elsewhere"

hints = [
    "'y' yanks (copies) the current selection",
    "'p' pastes after the cursor",
]

[scenarios.setup]
file_content = """fn main() {
    let x = 1;
}"""
cursor_position = [1, 8]

[scenarios.target]
file_content = """fn main() {
    let xx = 1;
}"""
cursor_position = [1, 9]

[scenarios.solution]
commands = ["y", "p"]
description = "Press 'y' to yank 'x', 'p' to paste after"

[scenarios.scoring]
optimal_count = 2
max_points = 100
tolerance = 1

[scenarios.metadata]
category = "clipboard"
difficulty = "beginner"
tags = ["yank", "paste", "copy"]
commands_taught = ["y", "p"]
estimated_time_seconds = 10

[[scenarios]]
id = "paste_before_001"
name = "Paste before cursor"
description = "Yank a character and paste it before cursor position"

hints = [
    "'y' yanks the current selection",
    "'P' (capital P) pastes before the cursor",
]

[scenarios.setup]
file_content = """fn add(a: i32) {
    a + a
}"""
cursor_position = [0, 7]

[scenarios.target]
file_content = """fn add(aa: i32) {
    a + a
}"""
cursor_position = [0, 7]

[scenarios.solution]
commands = ["y", "P"]
description = "Press 'y' to yank 'a', 'P' to paste before"

[scenarios.scoring]
optimal_count = 2
max_points = 100
tolerance = 1

[scenarios.metadata]
category = "clipboard"
difficulty = "beginner"
tags = ["paste"]
commands_taught = ["P"]
estimated_time_seconds = 10
