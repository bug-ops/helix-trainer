# Delete Selection Commands
# Scenarios for d (delete selection), dd (delete line)

[[scenarios]]
id = "delete_selection_001"
name = "Delete single character"
description = "Use 'd' to delete the character under cursor"

hints = [
    "'d' deletes the current selection",
    "Default selection is one character",
]

[scenarios.setup]
file_content = "Hello"
cursor_position = [0, 0]

[scenarios.target]
file_content = "ello"
cursor_position = [0, 0]

[scenarios.solution]
commands = ["d"]
description = "Press 'd' to delete selection"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "editing"
difficulty = "beginner"
tags = ["delete", "selection"]
commands_taught = ["d"]
estimated_time_seconds = 5

[[scenarios]]
id = "delete_selection_002"
name = "Delete character in middle"
description = "Delete a character from middle of word"

hints = [
    "'d' deletes whatever is selected",
    "Navigate to target first",
]

[scenarios.setup]
file_content = "Heello"
cursor_position = [0, 2]

[scenarios.target]
file_content = "Hello"
cursor_position = [0, 2]

[scenarios.solution]
commands = ["d"]
description = "Press 'd' to delete the extra 'e'"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "editing"
difficulty = "beginner"
tags = ["delete", "selection"]
