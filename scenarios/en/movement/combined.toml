# Combined Movement Scenarios
# Using multiple movement commands together

[[scenarios]]
id = "combined_move_001"
name = "Navigate to specific position"
description = "Use h, j, k, l to reach target"

hints = [
    "Combine movements for diagonal navigation",
    "Think about shortest path",
]

[scenarios.setup]
file_content = """fn main() {
    let x = 1;
    let y = 2;
}"""
cursor_position = [0, 0]

[scenarios.target]
file_content = """fn main() {
    let x = 1;
    let y = 2;
}"""
cursor_position = [1, 6]

[scenarios.solution]
commands = ["j", "l", "l", "l", "l", "l", "l"]
description = "Move down and right to 'x'"

[scenarios.scoring]
optimal_count = 7
max_points = 100
tolerance = 2

[scenarios.metadata]
category = "movement"
difficulty = "beginner"
tags = ["combined", "navigation"]
commands_taught = ["h", "j", "k", "l"]
estimated_time_seconds = 10

