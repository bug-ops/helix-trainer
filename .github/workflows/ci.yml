name: CI

# Minimal permissions for security best practices
permissions:
  contents: read
  # All other permissions are implicitly set to none

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test-${{ matrix.os }}"

      - name: Install ALSA development libraries (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests
        run: cargo nextest run --lib --verbose

      - name: Run doc tests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --doc --verbose

      - name: Check benchmarks compile
        if: matrix.os == 'ubuntu-latest'
        run: cargo bench --no-run

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo +nightly fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "clippy"

      - name: Install ALSA development libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Security audit with cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  msrv:
    name: Check MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          MSRV=$(grep '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$MSRV" >> $GITHUB_OUTPUT
          echo "Detected MSRV: $MSRV"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "msrv"

      - name: Install ALSA development libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Check with MSRV
        run: cargo check --all-features --verbose

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build-${{ matrix.os }}"

      - name: Install ALSA development libraries (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install cargo-bloat (Linux only)
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-bloat

      - name: Build release
        run: cargo build --release --verbose

      - name: Binary size analysis (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          echo "=== Binary Size Report (${{ matrix.os }}) ==="
          BINARY_PATH="target/release/helix-trainer"

          if [ -f "$BINARY_PATH" ]; then
            # Get file size
            SIZE=$(ls -lh "$BINARY_PATH" | awk '{print $5}')
            SIZE_BYTES=$(stat -f%z "$BINARY_PATH" 2>/dev/null || stat -c%s "$BINARY_PATH" 2>/dev/null)
            SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1024 / 1024" | bc)

            echo "Binary: $BINARY_PATH"
            echo "Size: $SIZE ($SIZE_MB MB)"
            echo "Size (bytes): $SIZE_BYTES"
            echo ""

            # Check if stripped (Unix)
            if file "$BINARY_PATH" | grep -q "not stripped"; then
              echo "⚠️  Warning: Binary is NOT stripped (strip=true in Cargo.toml should handle this)"
            else
              echo "✓ Binary is stripped"
            fi

            # Show section sizes (Unix)
            echo ""
            echo "=== Section Sizes ==="
            size "$BINARY_PATH" || true
          else
            echo "❌ Binary not found at $BINARY_PATH"
            exit 1
          fi

      - name: Binary size analysis (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "=== Binary Size Report (${{ matrix.os }}) ==="
          $BinaryPath = "target/release/helix-trainer.exe"

          if (Test-Path $BinaryPath) {
            $FileInfo = Get-Item $BinaryPath
            $SizeBytes = $FileInfo.Length
            $SizeMB = [math]::Round($SizeBytes / 1MB, 2)

            Write-Host "Binary: $BinaryPath"
            Write-Host "Size: $SizeMB MB"
            Write-Host "Size (bytes): $SizeBytes"
            Write-Host ""

            Write-Host "File details:"
            Get-Item $BinaryPath | Format-List Name, Length, LastWriteTime
          } else {
            Write-Host "❌ Binary not found at $BinaryPath"
            exit 1
          }

      - name: Analyze binary bloat (Linux only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          echo ""
          echo "=== Top 20 Functions by Size ==="
          cargo bloat --release -n 20 || true

          echo ""
          echo "=== Crate Size Breakdown ==="
          cargo bloat --release --crates -n 20 || true

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: helix-trainer-${{ matrix.os }}
          path: |
            target/release/helix-trainer
            target/release/helix-trainer.exe
          retention-days: 7
          if-no-files-found: ignore

  coverage:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "coverage"

      - name: Install ALSA development libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Generate coverage report
        run: |
          cargo llvm-cov --all-features --workspace --lcov \
            --output-path lcov.info nextest --verbose

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
          verbose: true
          flags: unittests
          name: helix-trainer-coverage

      - name: Archive coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 30

  gate:
    name: CI Gate
    if: always()
    needs: [test, fmt, clippy, security, msrv, build, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          results=(
            "${{ needs.test.result }}"
            "${{ needs.fmt.result }}"
            "${{ needs.clippy.result }}"
            "${{ needs.security.result }}"
            "${{ needs.msrv.result }}"
            "${{ needs.build.result }}"
            "${{ needs.coverage.result }}"
          )
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::One or more CI jobs failed or were cancelled"
              exit 1
            fi
          done
          echo "All CI jobs passed"
