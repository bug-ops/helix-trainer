# Goto Commands
# Scenarios for g-prefixed goto commands (gh, gl, gs, ge)

[[scenarios]]
id = "goto_line_start_001"
name = "Go to line start"
description = "Use 'gh' to go to the start of the current line"

hints = [
    "'gh' moves cursor to the beginning of the line",
    "Similar to '0' but part of the goto menu",
]

[scenarios.setup]
file_content = """fn main() {
    let result = calculate(10, 20);
    println!("{}", result);
}"""
cursor_position = [1, 20]

[scenarios.target]
file_content = """fn main() {
    let result = calculate(10, 20);
    println!("{}", result);
}"""
cursor_position = [1, 0]

[scenarios.solution]
commands = ["gh"]
description = "Press 'gh' to go to line start"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "movement"
difficulty = "beginner"
tags = ["goto", "line", "navigation"]
commands_taught = ["gh"]

[[scenarios]]
id = "goto_line_end_001"
name = "Go to line end"
description = "Use 'gl' to go to the end of the current line"

hints = [
    "'gl' moves cursor to the last character of the line",
    "Similar to '$' but part of the goto menu",
]

[scenarios.setup]
file_content = """fn add(a: i32, b: i32) -> i32 {
    a + b
}"""
cursor_position = [0, 3]

[scenarios.target]
file_content = """fn add(a: i32, b: i32) -> i32 {
    a + b
}"""
cursor_position = [0, 30]

[scenarios.solution]
commands = ["gl"]
description = "Press 'gl' to go to line end"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "movement"
difficulty = "beginner"
tags = ["goto", "line", "navigation"]
commands_taught = ["gl"]

[[scenarios]]
id = "goto_first_nonwhitespace_001"
name = "Go to first non-whitespace"
description = "Use 'gs' to go to the first non-whitespace character"

hints = [
    "'gs' skips leading whitespace",
    "Useful for indented code",
]

[scenarios.setup]
file_content = """fn process() {
    let value = 42;
    return value;
}"""
cursor_position = [1, 15]

[scenarios.target]
