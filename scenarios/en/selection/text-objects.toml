# Text Object Commands
# Scenarios for mi*/ma* (match inside/around) text objects
# Commands: miw, maw, mip, map, mi(, ma(, mi[, ma[, mi{, ma{, mi", ma", mi', ma'

# ============================================================================
# WORD OBJECTS (miw, maw)
# ============================================================================

[[scenarios]]
id = "text_object_miw_001"
name = "Select inside word - basic"
description = "Use 'miw' to select the word under cursor (without surrounding whitespace)"

hints = [
    "'mi' starts match-inside, followed by the object type",
    "'w' is the word object",
    "'miw' selects just the word characters, not surrounding spaces",
]

[scenarios.setup]
file_content = "hello beautiful world"
cursor_position = [0, 6]

[scenarios.target]
file_content = "hello beautiful world"
cursor_position = [0, 6]
selection = [0, 6, 0, 15]

[scenarios.solution]
commands = ["miw"]
description = "Press 'miw' to select 'beautiful'"

[scenarios.scoring]
optimal_count = 3
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "selection"
difficulty = "intermediate"
tags = ["text-object", "word", "selection"]
commands_taught = ["miw"]
estimated_time_seconds = 10

[[scenarios]]
id = "text_object_miw_002"
name = "Select inside word - at word start"
description = "Select word when cursor is at the beginning of the word"

hints = [
