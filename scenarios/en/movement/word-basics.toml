[[scenarios]]
id = "word_backward_basic_001"
name = "Move backward one word"
description = "Use 'b' to jump to previous word start"

hints = [
    "'b' moves to the start of the previous word",
    "Opposite of 'w'",
]

[scenarios.setup]
file_content = """fn process_data(input: &str) -> Result<i32, Error> {
    let mut counter = 0;
    let items: Vec<_> = input.lines().collect();

    for line in items.iter() {
        counter += 1;
    }

    Ok(counter)
}"""
