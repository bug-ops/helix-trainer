# Precision Movement Scenarios
# Single-step navigation challenges

[[scenarios]]
id = "precision_left_001"
name = "Move left exactly once"
description = "Navigate left by one character"

hints = [
    "'h' moves cursor left",
    "Precise for small adjustments",
]

[scenarios.setup]
file_content = """let x = 10;"""
cursor_position = [0, 6]

[scenarios.target]
file_content = """let x = 10;"""
cursor_position = [0, 5]

[scenarios.solution]
commands = ["h"]
description = "Press 'h' to move left"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "movement"
difficulty = "beginner"
tags = ["character", "precision"]
commands_taught = ["h"]
estimated_time_seconds = 5

