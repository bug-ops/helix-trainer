# Indentation Operations
# Scenarios covering indentation control

[[scenarios]]
id = "indent_line_001"
name = "Indent code line"
description = "Add indentation to a line of code"

hints = [
    "'>' adds one indent level at the start of the line (4 spaces in Rust)",
    "Use multiple times to add more indentation",
]

[scenarios.setup]
file_content = """fn main() {
let x = 42;
    println!("{}", x);
}"""
cursor_position = [1, 0]

[scenarios.target]
file_content = """fn main() {
    let x = 42;
    println!("{}", x);
}"""
cursor_position = [1, 4]

[scenarios.solution]
commands = [">"]
description = "Press '>' to indent the line"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "editing"
difficulty = "beginner"
tags = ["indent"]
commands_taught = [">"]

[[scenarios]]
id = "dedent_line_001"
name = "Remove indentation"
description = "Remove indentation from a line"

hints = [
    "'<' removes one indent level from the start of the line (up to 4 spaces in Rust)",
    "Use multiple times to remove more indentation",
]

[scenarios.setup]
file_content = """fn process() {
    if ready {
        let value = 0;
    }
}"""
cursor_position = [2, 0]

[scenarios.target]
file_content = """fn process() {
    if ready {
    let value = 0;
    }
}"""
cursor_position = [2, 0]

[scenarios.solution]
commands = ["<"]
description = "Press '<' to remove indentation"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "editing"
difficulty = "beginner"
tags = ["dedent", "indent"]
commands_taught = ["<"]
