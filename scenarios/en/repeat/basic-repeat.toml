# Repeat Command Scenarios
# '.' replays the last Insert session only (hx `repeat_last_insert`)

[[scenarios]]
id = "repeat_delete_char_001"
name = "Repeat a change"
description = "Change a character with 'c', then repeat the change with the '.' command"

hints = [
    "The '.' command repeats the last insert: the command that entered Insert mode, the typed text and Escape",
    "Press 'c' to delete the character and type '_' in its place, then Escape",
    "Move right with 'l', then press '.' to change the character under the cursor the same way",
]

[scenarios.setup]
file_content = """let xyz = 1;"""
cursor_position = [0, 4]

[scenarios.target]
file_content = """let _y_ = 1;"""
cursor_position = [0, 7]

[scenarios.solution]
commands = ["c", "_", "Escape", "l", "."]
description = "Press 'c', type '_' and Escape to replace 'x', move right with 'l', then '.' to repeat the change on 'z'"

[scenarios.scoring]
optimal_count = 5
max_points = 100
tolerance = 1

[scenarios.metadata]
category = "advanced"
difficulty = "intermediate"
tags = ["repeat", "change"]
commands_taught = ["."]

[[scenarios]]
id = "repeat_delete_line_001"
name = "Delete lines one by one"
description = "Delete two lines, each with 'x' then 'd'"

hints = [
    "Use 'x' to select the current line, then 'd' to delete it",
    "The '.' command repeats only the last insert, so delete the second line with 'x' and 'd' again",
]

[scenarios.setup]
file_content = """let a = 1;
let b = 2;
let c = 3;
let d = 4;"""
cursor_position = [0, 4]

[scenarios.target]
file_content = """let c = 3;
let d = 4;"""
cursor_position = [0, 0]

[scenarios.solution]
commands = ["x", "d", "x", "d"]
description = "Press 'x' to select the line and 'd' to delete it, twice"

[scenarios.scoring]
optimal_count = 4
max_points = 100
tolerance = 1

[scenarios.metadata]
category = "advanced"
difficulty = "intermediate"
tags = ["delete", "line", "selection"]
commands_taught = ["x", "d"]

[[scenarios]]
id = "repeat_insert_001"
name = "Repeat append"
description = "Use 'a' to append text, then repeat with '.'"

hints = [
    "The repeat command replays the last insert action",
    "After 'a', typing and Escape, the selection covers the typed text, so '.' appends after it",
]

[scenarios.setup]
file_content = """fn f() {}"""
cursor_position = [0, 4]

[scenarios.target]
file_content = """fn f(xx) {}"""
cursor_position = [0, 7]

[scenarios.solution]
commands = ["a", "x", "Escape", "."]
description = "Append 'x' after '(', then repeat with '.' to append another 'x' after the selection"

[scenarios.scoring]
optimal_count = 4
max_points = 100
tolerance = 1

[scenarios.metadata]
category = "advanced"
difficulty = "intermediate"
tags = ["repeat", "insert"]
commands_taught = ["."]


[[scenarios]]
id = "repeat_indent_001"
name = "Indent lines one by one"
description = "Indent a line, then move down and indent the next one"

hints = [
    "The '>' command indents the current line",
    "The '.' command repeats only the last insert, so press '>' again on the next line",
    "Navigate between lines with 'j' (down)",
]

[scenarios.setup]
file_content = """fn main() {
println!("a");
println!("b");
}"""
cursor_position = [1, 0]

[scenarios.target]
file_content = """fn main() {
    println!("a");
    println!("b");
}"""
cursor_position = [2, 8]

[scenarios.solution]
commands = [">", "j", ">"]
description = "Indent line 2 with '>', move down with 'j', indent line 3 with '>'"

[scenarios.scoring]
optimal_count = 3
max_points = 100
tolerance = 2

[scenarios.metadata]
category = "advanced"
difficulty = "intermediate"
tags = ["indent"]
commands_taught = [">"]

[[scenarios]]
id = "repeat_replace_001"
name = "Replace characters one by one"
description = "Replace a character, then replace another one elsewhere"

hints = [
    "The 'r' command replaces a single character",
    "Format: 'r' followed by the new character (e.g., 'r_')",
    "Use 'l' to move right to the next '-'",
    "The '.' command repeats only the last insert, so type 'r_' again",
]

[scenarios.setup]
file_content = """foo-bar-baz"""
cursor_position = [0, 3]

[scenarios.target]
file_content = """foo_bar_baz"""
cursor_position = [0, 7]

[scenarios.solution]
commands = ["r_", "l", "l", "l", "l", "r_"]
description = "Replace '-' with '_' using 'r_', move to the next '-' with 'llll', replace it with 'r_'"

[scenarios.scoring]
optimal_count = 6
max_points = 100
tolerance = 3

[scenarios.metadata]
category = "advanced"
difficulty = "intermediate"
tags = ["replace"]
commands_taught = ["r"]
