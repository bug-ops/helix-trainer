# Advanced Selection Commands
# Scenarios for _, C, Alt-C, Alt-s, Ctrl-c, Alt--, Alt-x

# ============================================================================
# TRIM SELECTIONS (_ command)
# ============================================================================

[[scenarios]]
id = "trim_selections_001"
name = "Trim whitespace from selection"
description = "Use '_' to trim leading and trailing whitespace from selection"

hints = [
    "'_' removes whitespace at selection boundaries",
    "The text content is not modified, only the selection",
]

[scenarios.setup]
file_content = "   hello   "
cursor_position = [0, 0]
selection = [0, 0, 0, 11]

[scenarios.target]
file_content = "   hello   "
cursor_position = [0, 2]
selection = [0, 3, 0, 8]

[scenarios.solution]
commands = ["_"]
description = "Press '_' to trim whitespace from selection boundaries"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "selection"
difficulty = "intermediate"
tags = ["selection", "trim", "whitespace"]
commands_taught = ["_"]
estimated_time_seconds = 10

[[scenarios]]
id = "trim_selections_002"
name = "Trim leading whitespace only"
description = "Trim selection that has only leading whitespace"

hints = [
    "'_' trims both leading and trailing whitespace",
    "Only whitespace at boundaries is removed from selection",
]

[scenarios.setup]
file_content = "    word"
cursor_position = [0, 0]
selection = [0, 0, 0, 8]

[scenarios.target]
file_content = "    word"
cursor_position = [0, 3]
selection = [0, 4, 0, 8]

[scenarios.solution]
commands = ["_"]
description = "Press '_' to trim leading whitespace"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "selection"
difficulty = "intermediate"
tags = ["selection", "trim", "whitespace"]
commands_taught = ["_"]
estimated_time_seconds = 10

# ============================================================================
# COPY SELECTION TO NEXT/PREV LINE (C, Alt-C commands)
# ============================================================================

[[scenarios]]
id = "copy_selection_next_001"
name = "Copy cursor to next line"
description = "Use 'C' to move cursor to the next line at same column"

hints = [
    "'C' copies the cursor position to the next line",
    "Great for editing multiple similar lines",
]

[scenarios.setup]
file_content = "item: value\nitem: value\nitem: value"
cursor_position = [0, 3]

[scenarios.target]
file_content = "item: value\nitem: value\nitem: value"
cursor_position = [1, 3]

[scenarios.solution]
commands = ["C"]
description = "Press 'C' to move cursor to next line"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "selection"
difficulty = "intermediate"
tags = ["selection", "cursor", "line"]
commands_taught = ["C"]
estimated_time_seconds = 10

[[scenarios]]
id = "copy_selection_prev_001"
name = "Copy cursor to previous line"
description = "Use 'Alt-C' to move cursor to the previous line at same column"

hints = [
    "'Alt-C' copies the cursor position to the previous line",
    "Opposite of 'C' command",
]

[scenarios.setup]
file_content = "item: value\nitem: value\nitem: value"
cursor_position = [2, 5]

[scenarios.target]
file_content = "item: value\nitem: value\nitem: value"
cursor_position = [1, 5]

[scenarios.solution]
commands = ["Alt-C"]
description = "Press 'Alt-C' to move cursor to previous line"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "selection"
difficulty = "intermediate"
tags = ["selection", "cursor", "line"]
commands_taught = ["Alt-C"]
estimated_time_seconds = 10

[[scenarios]]
id = "copy_selection_next_clamp_001"
name = "Copy cursor clamps to shorter line"
description = "When next line is shorter, cursor is clamped to line end"

hints = [
    "'C' clamps the column if the next line is shorter",
    "Prevents cursor from going past line end",
]

[scenarios.setup]
file_content = "long line here\nshort"
cursor_position = [0, 12]

[scenarios.target]
file_content = "long line here\nshort"
cursor_position = [1, 5]

[scenarios.solution]
commands = ["C"]
description = "Press 'C' to move to next line (column clamped)"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "selection"
difficulty = "intermediate"
tags = ["selection", "cursor", "clamping"]
commands_taught = ["C"]
estimated_time_seconds = 10

# ============================================================================
# SPLIT SELECTION ON NEWLINES (Alt-s command)
# ============================================================================

[[scenarios]]
id = "split_selection_newlines_001"
name = "Split selection on newlines"
description = "Use 'Alt-s' to split a multi-line selection into per-line selections"

hints = [
    "'Alt-s' creates one selection per line",
    "Useful for applying edits to each line individually",
]

[scenarios.setup]
file_content = "line 1\nline 2\nline 3"
cursor_position = [0, 0]
selection = [0, 0, 2, 6]

[scenarios.target]
file_content = "line 1\nline 2\nline 3"
cursor_position = [0, 6]
selection = [0, 0, 0, 6]

[scenarios.solution]
commands = ["Alt-s"]
description = "Press 'Alt-s' to split selection on newlines (keeps first line)"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "selection"
difficulty = "intermediate"
tags = ["selection", "split", "lines"]
commands_taught = ["Alt-s"]
estimated_time_seconds = 15

# ============================================================================
# SHRINK TO LINE BOUNDS (Alt-x command)
# ============================================================================

[[scenarios]]
id = "shrink_to_line_bounds_001"
name = "Shrink selection to line"
description = "Use 'Alt-x' to shrink selection to the current line bounds"

hints = [
    "'Alt-x' selects the entire current line",
    "Useful for line-oriented editing operations",
]

[scenarios.setup]
file_content = "hello world\nsecond line"
cursor_position = [0, 5]

[scenarios.target]
file_content = "hello world\nsecond line"
cursor_position = [0, 0]
selection = [0, 0, 0, 11]

[scenarios.solution]
commands = ["Alt-x"]
description = "Press 'Alt-x' to select current line"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "selection"
difficulty = "intermediate"
tags = ["selection", "line", "shrink"]
commands_taught = ["Alt-x"]
estimated_time_seconds = 10

