# Basic Delete Operations
# Scenarios covering line deletion and character deletion

[[scenarios]]
id = "delete_current_line_001"
name = "Delete current line"
description = "Delete the current line where the cursor is located. In Helix, use 'x' to select line then 'd' to delete."

hints = [
    "In Helix, 'x' selects the current line (including newline)",
    "Then 'd' deletes the selection",
    "This is different from Vim's 'dd' - Helix uses selection-first approach",
]

[scenarios.setup]
file_content = """fn calculate_total(prices: &[f64]) -> f64 {
    let mut total = 0.0;
    let discount = 0.1;
    let debug = true;

    for price in prices {
        total += price;
    }

    total * (1.0 - discount)
}"""
cursor_position = [3, 4]

[scenarios.target]
file_content = """fn calculate_total(prices: &[f64]) -> f64 {
    let mut total = 0.0;
    let discount = 0.1;

    for price in prices {
        total += price;
    }

    total * (1.0 - discount)
}"""
cursor_position = [3, 0]

[scenarios.solution]
commands = ["x", "d"]
description = "Press 'x' to select line, then 'd' to delete the selection"

[scenarios.scoring]
optimal_count = 2
max_points = 100
tolerance = 1

[scenarios.metadata]
category = "editing"
difficulty = "beginner"
tags = ["delete", "line", "basic", "selection"]
commands_taught = ["x", "d"]
estimated_time_seconds = 20
