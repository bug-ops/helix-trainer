# Document-Level Navigation
# Scenarios covering document-wide movement

[[scenarios]]
id = "document_navigation_001"
name = "Jump to document start"
description = "Navigate to the beginning of the document"

hints = [
    "'gg' jumps to the first line of the document",
    "'ge' jumps to the last line of the document",
]

[scenarios.setup]
file_content = """Line 1
Line 2
Line 3
Line 4
Line 5"""
cursor_position = [4, 0]

[scenarios.target]
file_content = """Line 1
Line 2
Line 3
Line 4
Line 5"""
cursor_position = [0, 0]

[scenarios.solution]
commands = ["gg"]
description = "Press 'gg' to jump to document start"

[scenarios.scoring]
optimal_count = 2
max_points = 100
tolerance = 1

[scenarios.metadata]
category = "movement"
difficulty = "beginner"
tags = ["document", "navigation"]
commands_taught = ["gg"]
estimated_time_seconds = 20

