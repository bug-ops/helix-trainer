[[scenarios]]
id = "insert_line_start_001"
name = "Insert at line start"
description = "Move to start of line and enter insert mode"

hints = [
    "'I' moves to line start and enters insert mode",
    "Don't forget to press Escape to exit insert mode",
]

[scenarios.setup]
file_content = """fn test() {
println!("debug");
    return true;
}"""
cursor_position = [1, 10]

[scenarios.target]
file_content = """fn test() {
//println!("debug");
    return true;
}"""
cursor_position = [1, 2]

[scenarios.solution]
commands = ["I", "/", "/", "Escape"]
description = "Press 'I' to move to start, type '//', then Escape"

[scenarios.scoring]
optimal_count = 4
max_points = 100
tolerance = 1

[scenarios.metadata]
category = "editing"
difficulty = "beginner"
tags = ["insert", "line-start"]
commands_taught = ["I"]
estimated_time_seconds = 10

[[scenarios]]
id = "append_line_end_001"
name = "Append at line end"
description = "Move to end of line and enter insert mode"

hints = [
    "'A' moves to line end and enters insert mode",
    "Don't forget to press Escape to exit insert mode",
]

[scenarios.setup]
file_content = """struct Point {
    x: i32,
    y: i32
}"""
cursor_position = [2, 4]

[scenarios.target]
file_content = """struct Point {
    x: i32,
    y: i32,
}"""
cursor_position = [2, 11]

[scenarios.solution]
commands = ["A", ",", "Escape"]
description = "Press 'A' to move to end, ',' to add comma, Escape to exit"

[scenarios.scoring]
optimal_count = 3
max_points = 100
tolerance = 1

[scenarios.metadata]
category = "editing"
difficulty = "beginner"
tags = ["insert", "line-end", "append"]
commands_taught = ["A"]
