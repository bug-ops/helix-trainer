# Advanced Editing Commands
# Scenarios for J, Alt-J, >, <, ~, `, Alt-`, R

# ============================================================================
# JOIN LINES (J command)
# ============================================================================

[[scenarios]]
id = "join_lines_001"
name = "Join two lines"
description = "Use 'J' to join the current line with the next line"

hints = [
    "'J' joins lines by removing the newline",
    "The lines are concatenated directly without adding space",
]

[scenarios.setup]
file_content = """let first = 1;
let second = 2;"""
cursor_position = [0, 4]

[scenarios.target]
file_content = """let first = 1; let second = 2;"""
cursor_position = [0, 4]

[scenarios.solution]
commands = ["J"]
description = "Press 'J' to join lines (adds space)"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "editing"
difficulty = "intermediate"
tags = ["join", "lines", "editing"]
commands_taught = ["J"]

[[scenarios]]
id = "join_lines_002"
name = "Join multiple lines"
description = "Use 'J' twice to join three lines into one"

hints = [
    "Repeat 'J' to join more lines",
    "Each 'J' joins with a space between",
]

[scenarios.setup]
file_content = """let a = 1;
let b = 2;
let c = 3;"""
cursor_position = [0, 4]

[scenarios.target]
file_content = """let a = 1; let b = 2; let c = 3;"""
cursor_position = [0, 4]

[scenarios.solution]
commands = ["J", "J"]
description = "Press 'J' twice to join all three lines"

[scenarios.scoring]
optimal_count = 2
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "editing"
difficulty = "intermediate"
tags = ["join", "lines", "editing"]
commands_taught = ["J"]

# ============================================================================
# JOIN WITH SPACE (Alt-J command)
# ============================================================================

[[scenarios]]
id = "join_space_001"
name = "Join lines with space"
description = "Use 'Alt-J' to join lines with a space between them"

hints = [
    "'Alt-J' joins lines and inserts a space",
    "Unlike 'J', this adds a separator",
]

[scenarios.setup]
file_content = """fn main() {
    println!("Hi");
}"""
selection = [0, 0, 1, 18]

[scenarios.target]
file_content = """fn main() { println!("Hi");
}"""
selection = [0, 11, 0, 12]

[scenarios.solution]
commands = ["Alt-J"]
description = "Press 'Alt-J' to join with space"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "editing"
difficulty = "intermediate"
tags = ["join", "space", "editing"]
commands_taught = ["Alt-J"]

# ============================================================================
# INDENT / DEDENT (> and < commands)
# ============================================================================

[[scenarios]]
id = "indent_001"
name = "Indent a line"
description = "Use '>' to add indentation to the current line"

hints = [
    "'>' adds one indent level of leading whitespace (4 spaces in Rust)",
    "Useful for formatting code blocks",
]

[scenarios.setup]
file_content = """fn main() {
println!("test");
}"""
cursor_position = [1, 0]

[scenarios.target]
file_content = """fn main() {
    println!("test");
}"""
cursor_position = [1, 4]

[scenarios.solution]
commands = [">"]
description = "Press '>' to indent the line (adds 4 spaces)"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "editing"
difficulty = "beginner"
tags = ["indent", "formatting", "editing"]
commands_taught = [">"]

[[scenarios]]
id = "dedent_001"
name = "Remove indentation"
description = "Use '<' to remove indentation from the current line"

hints = [
    "'<' removes one indent level of leading whitespace (up to 4 spaces in Rust)",
    "Opposite of '>' command",
]

[scenarios.setup]
file_content = """fn main() {
    if true {
        let x = 1;
    }
}"""
cursor_position = [2, 8]

[scenarios.target]
file_content = """fn main() {
    if true {
    let x = 1;
    }
}"""
cursor_position = [2, 4]

[scenarios.solution]
commands = ["<"]
description = "Press '<' to dedent the line (removes 4 spaces)"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "editing"
difficulty = "beginner"
tags = ["dedent", "formatting", "editing"]
commands_taught = ["<"]

# ============================================================================
# SWITCH CASE (~ and ` commands)
# ============================================================================

[[scenarios]]
id = "switch_case_001"
name = "Toggle character case"
description = "Use '~' to toggle the case of selected character"

hints = [
    "'~' toggles between upper and lower case",
    "Works on the character under cursor",
]

[scenarios.setup]
file_content = """let value = 42;"""
cursor_position = [0, 4]

[scenarios.target]
file_content = """let Value = 42;"""
cursor_position = [0, 4]

[scenarios.solution]
commands = ["~"]
description = "Press '~' to toggle the first character's case"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "editing"
difficulty = "beginner"
tags = ["case", "toggle", "editing"]
commands_taught = ["~"]

[[scenarios]]
id = "switch_case_002"
name = "Toggle selected text case"
description = "Select text and toggle case using '~'"

hints = [
    "First select the text you want to toggle",
    "'~' toggles case of all selected characters",
]

[scenarios.setup]
file_content = """let msg = "ok";"""
selection = [0, 11, 0, 13]

[scenarios.target]
file_content = """let msg = "OK";"""
selection = [0, 11, 0, 13]

[scenarios.solution]
commands = ["~"]
description = "Press '~' to toggle case of selected text"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "editing"
difficulty = "beginner"
tags = ["case", "toggle", "editing", "selection"]
commands_taught = ["~"]

[[scenarios]]
id = "switch_case_alt_001"
name = "Lowercase with backtick"
description = "Use '`' to convert the selected text to lowercase"

hints = [
    "'`' converts the selected text to lowercase",
    "First select the text you want to convert",
]

[scenarios.setup]
file_content = """const MAX = 100;"""
selection = [0, 6, 0, 9]

[scenarios.target]
file_content = """const max = 100;"""
selection = [0, 6, 0, 9]

[scenarios.solution]
commands = ["`"]
description = "Press '`' to lowercase the selected text"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "editing"
difficulty = "beginner"
tags = ["case", "lowercase", "editing", "selection"]
commands_taught = ["`"]

# ============================================================================
# UPPERCASE (Alt-` command)
# ============================================================================

[[scenarios]]
id = "uppercase_001"
name = "Convert a selection to uppercase"
description = "Use 'Alt-`' to turn mixed-case text into all capitals"

hints = [
    "'x' selects the whole line",
    "'Alt-`' converts the selection to uppercase",
    "'~' would only flip each letter's case, leaving 'Hello' as 'hELLO'",
]

[scenarios.setup]
file_content = """Hello World"""
cursor_position = [0, 0]

[scenarios.target]
file_content = """HELLO WORLD"""
selection = [0, 0, 0, 11]

[scenarios.solution]
commands = ["x", "Alt-`"]
description = "Press 'x' to select the line, then 'Alt-`' to uppercase it"

[scenarios.scoring]
optimal_count = 2
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "editing"
difficulty = "beginner"
tags = ["case", "uppercase", "editing", "selection"]
commands_taught = ["Alt-`"]

