# Prose Emphasis (Writing track)
# Scenarios for wrapping words in Markdown emphasis markers using 'ms' (add surround)

[[scenarios]]
id = "writing_emphasis_italic_001"
name = "Italicize a word"
description = "Select a word and wrap it in single asterisks for Markdown italic emphasis"

hints = [
    "'miw' selects the word under the cursor",
    "'ms*' wraps the current selection in the given character on both sides",
]

[scenarios.setup]
file_content = """This is important information."""
language = "md"
cursor_position = [0, 8]

[scenarios.target]
file_content = """This is *important* information."""
cursor_position = [0, 18]

[scenarios.solution]
commands = ["miw", "ms*"]
description = "Select the word with 'miw', then wrap it with 'ms*'"

[scenarios.scoring]
optimal_count = 6
max_points = 100
tolerance = 1

[scenarios.metadata]
category = "writing"
difficulty = "beginner"
tags = ["surround", "emphasis", "italic", "markdown"]
commands_taught = ["ms", "miw"]
estimated_time_seconds = 15

[[scenarios]]
id = "writing_emphasis_bold_001"
name = "Bold a word"
description = "Select a word and wrap it twice in asterisks for Markdown bold emphasis"

hints = [
    "Applying 'ms*' twice to the same word produces '**word**'",
    "The surround add keeps the original text selected after wrapping, so it can be repeated",
]

[scenarios.setup]
file_content = """This is important information."""
language = "md"
cursor_position = [0, 8]

[scenarios.target]
file_content = """This is **important** information."""
cursor_position = [0, 19]

[scenarios.solution]
commands = ["miw", "ms*", "ms*"]
description = "Select the word with 'miw', then wrap it with 'ms*' twice for bold"

[scenarios.scoring]
optimal_count = 9
max_points = 100
tolerance = 1

[scenarios.metadata]
category = "writing"
difficulty = "intermediate"
tags = ["surround", "emphasis", "bold", "markdown"]
commands_taught = ["ms", "miw"]
estimated_time_seconds = 15
