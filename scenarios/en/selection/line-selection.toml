# Line Selection Commands
# Scenarios for x (select line) and X (extend to line bounds)

[[scenarios]]
id = "select_line_001"
name = "Select current line"
description = "Use 'x' to select the entire current line"

hints = [
    "'x' selects the current line including newline",
    "Selection will be highlighted",
]

[scenarios.setup]
file_content = "Line 1\nLine 2\nLine 3"
cursor_position = [1, 2]

[scenarios.target]
file_content = "Line 1\nLine 2\nLine 3"
cursor_position = [1, 0]
selection = [1, 0, 2, 0]

[scenarios.solution]
commands = ["x"]
description = "Press 'x' to select the line"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "selection"
difficulty = "beginner"
tags = ["selection", "line"]
commands_taught = ["x"]
estimated_time_seconds = 5

[[scenarios]]
id = "select_line_002"
name = "Select first line"
description = "Select the first line of the document"

hints = [
    "'x' works on any line",
    "Selects from line start to next line start",
]

[scenarios.setup]
file_content = "Hello World\nSecond line"
cursor_position = [0, 5]

[scenarios.target]
file_content = "Hello World\nSecond line"
cursor_position = [0, 0]
selection = [0, 0, 1, 0]

[scenarios.solution]
commands = ["x"]
description = "Press 'x' to select the first line"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "selection"
difficulty = "beginner"
tags = ["selection", "line"]
commands_taught = ["x"]
estimated_time_seconds = 5

[[scenarios]]
id = "extend_line_001"
name = "Extend selection to line bounds"
description = "Use 'X' to extend selection to full line bounds"

hints = [
    "'X' extends the selection to include full lines",
    "Useful after partial selections",
]

[scenarios.setup]
file_content = "ABCDEF\nGHIJKL"
cursor_position = [0, 2]
selection = [0, 2, 0, 4]

[scenarios.target]
file_content = "ABCDEF\nGHIJKL"
cursor_position = [0, 0]
selection = [0, 0, 1, 0]

[scenarios.solution]
commands = ["X"]
description = "Press 'X' to extend to line bounds"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "selection"
difficulty = "intermediate"
tags = ["selection", "extend", "line"]
commands_taught = ["X"]
estimated_time_seconds = 5
