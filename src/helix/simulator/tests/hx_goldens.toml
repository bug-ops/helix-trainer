# Cases recorded from hx 25.07.1 (see examples/hx_differential.rs).
# Regenerate the expected text with `cargo run --example hx_differential -- --write`.

[[case]]
id = "backspace_auto_indent_loses_a_unit"
text = """
fn f() {
    x
}"""
language = "rs"
keys = ["j", "o", "Backspace", "x", "Escape"]
probe = "selection"
expected = """
fn f() {
    x
x@}"""

