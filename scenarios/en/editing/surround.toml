# Surround Commands
# Scenarios for md (delete surround) and mr (replace surround)
# Note: ms (add surround) scenarios live under scenarios/en/writing/

# ============================================================================
# DELETE SURROUND (md{char})
# ============================================================================

[[scenarios]]
id = "surround_delete_parens_001"
name = "Delete surrounding parentheses"
description = "Use 'md(' to remove the parentheses around text"

hints = [
    "'md' enters surround delete mode, then type the character to delete",
    "Cursor must be inside the pair to delete",
]

[scenarios.setup]
file_content = """let result = (x + y);"""
cursor_position = [0, 15]

[scenarios.target]
file_content = """let result = x + y;"""
cursor_position = [0, 14]

[scenarios.solution]
commands = ["md("]
description = "Press 'md(' to delete the parentheses"

[scenarios.scoring]
optimal_count = 3
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "editing"
difficulty = "intermediate"
tags = ["surround", "delete", "parentheses"]
commands_taught = ["md"]
estimated_time_seconds = 10

[[scenarios]]
id = "surround_delete_brackets_001"
