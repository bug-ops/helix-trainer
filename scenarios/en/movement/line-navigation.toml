# Line Navigation
# Scenarios for gh, gl, gg, ge commands

[[scenarios]]
id = "line_start_basic_001"
name = "Move to line start"
description = "Jump to beginning of line"

hints = [
    "'gh' moves cursor to column 0",
    "Works on any line",
]

[scenarios.setup]
file_content = """fn validate(data: &Data) -> bool {
    let name = data.get("name").unwrap_or("default");
    let items = [1, 2, 3, 4, 5];

    if name.len() > 0 && items.contains(&data.id) {
        println!("Valid: {}", name);
        return true;
    }
    false
}"""
cursor_position = [1, 20]

[scenarios.target]
file_content = """fn validate(data: &Data) -> bool {
    let name = data.get("name").unwrap_or("default");
    let items = [1, 2, 3, 4, 5];

    if name.len() > 0 && items.contains(&data.id) {
        println!("Valid: {}", name);
        return true;
    }
    false
}"""
cursor_position = [1, 0]

[scenarios.solution]
commands = ["gh"]
description = "Press 'gh' to go to line start"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "movement"
difficulty = "beginner"
tags = ["line", "start"]
commands_taught = ["gh"]
estimated_time_seconds = 5

[[scenarios]]
id = "line_start_basic_002"
name = "Move to start from end"
description = "Jump from end of line to start"

hints = [
    "'gh' always goes to column 0",
