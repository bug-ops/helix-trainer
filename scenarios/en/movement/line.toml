# Line Movement Operations
# Scenarios covering line-level navigation

[[scenarios]]
id = "line_navigation_001"
name = "Jump to line end"
description = "Navigate from line start to line end"

hints = [
    "'gl' jumps to the end of the current line",
    "'gh' jumps to the start of the line",
]

[scenarios.setup]
file_content = """fn calculate_total(prices: &[f64]) -> f64 {
    let mut total = 0.0;
    let discount = 0.1;

    for price in prices {
        total += price;
    }

    total * (1.0 - discount)
}"""
cursor_position = [1, 4]

[scenarios.target]
file_content = """fn calculate_total(prices: &[f64]) -> f64 {
    let mut total = 0.0;
    let discount = 0.1;

    for price in prices {
        total += price;
    }

    total * (1.0 - discount)
}"""
cursor_position = [1, 23]

[scenarios.solution]
commands = ["gl"]
description = "Press 'gl' to jump to end of line"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "movement"
difficulty = "beginner"
tags = ["line", "navigation"]
commands_taught = ["gl"]
estimated_time_seconds = 15

[[scenarios]]
id = "line_start_001"
name = "Jump to line start"
description = "Navigate from line end to line start"

hints = [
    "'gh' jumps to the start of the current line",
    "'gl' jumps to the end of the line",
]

[scenarios.setup]
file_content = """fn process_data(input: &str) -> Result<i32, Error> {
    let mut counter = 0;
    let items: Vec<_> = input.lines().collect();

    for line in items.iter() {
        counter += 1;
    }

    Ok(counter)
}"""
cursor_position = [2, 35]

[scenarios.target]
file_content = """fn process_data(input: &str) -> Result<i32, Error> {
    let mut counter = 0;
    let items: Vec<_> = input.lines().collect();

    for line in items.iter() {
        counter += 1;
    }

    Ok(counter)
}"""
cursor_position = [2, 0]

[scenarios.solution]
commands = ["gh"]
description = "Press 'gh' to jump to start of line"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "movement"
difficulty = "beginner"
tags = ["line", "navigation"]
commands_taught = ["gh"]
estimated_time_seconds = 15
