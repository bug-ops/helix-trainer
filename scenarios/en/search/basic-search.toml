    let count = 0;
    for i in 0..10 {
        count += 1;
    }
    println!("{}", count);
}"""
selection = [5, 19, 5, 24]

[scenarios.solution]
commands = ["miw", "*", "N"]
description = "Select 'count' with 'miw', press '*' to search for it, then 'N' to go backward to the last occurrence"

[scenarios.scoring]
optimal_count = 3
max_points = 100
tolerance = 0

[scenarios.metadata]
