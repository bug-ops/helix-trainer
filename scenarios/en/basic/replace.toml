# Basic Replace and Change Operations
# Scenarios covering character replacement and change operations

[[scenarios]]
id = "select_word_001"
name = "Select current word"
description = "Select the word under the cursor"

hints = [
    "In Helix, 'e' extends selection to the end of the word",
    "After selecting, you can delete with 'd', change with 'c', etc.",
]

[scenarios.setup]
file_content = """fn process_data(input: &str) -> Result<i32, Error> {
    let mut counter = 0;
    let items: Vec<_> = input.lines().collect();

    for line in items.iter() {
        counter += 1;
    }

    Ok(counter)
}"""
cursor_position = [1, 12]

[scenarios.target]
file_content = """fn process_data(input: &str) -> Result<i32, Error> {
    let mut counter = 0;
    let items: Vec<_> = input.lines().collect();

    for line in items.iter() {
        counter += 1;
    }

    Ok(counter)
}"""
cursor_position = [1, 12]
selection = [1, 12, 1, 19]

[scenarios.solution]
commands = ["e"]
description = "Press 'e' to select to the end of 'counter'"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "movement"
difficulty = "beginner"
tags = ["selection", "word"]
commands_taught = ["e"]
estimated_time_seconds = 15

[[scenarios]]
id = "replace_char_001"
name = "Fix typo with replace"
description = "Replace a single character to fix a typo"

hints = [
    "'r' followed by any character replaces the character under cursor",
    "Unlike 'i', replace doesn't enter insert mode",
]

[scenarios.setup]
file_content = """fn calculate_total(prices: &[f64]) -> f64 {
    let mur total = 0.0;
    let discount = 0.1;

    for price in prices {
        total += price;
    }

    total * (1.0 - discount)
}"""
cursor_position = [1, 8]

[scenarios.target]
file_content = """fn calculate_total(prices: &[f64]) -> f64 {
    let mut total = 0.0;
    let discount = 0.1;

    for price in prices {
        total += price;
    }

    total * (1.0 - discount)
}"""
cursor_position = [1, 8]

[scenarios.solution]
commands = ["rt"]
description = "Press 'r' then 't' to replace 'r' with 't' (mur -> mut)"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "editing"
difficulty = "beginner"
tags = ["replace", "typo"]
commands_taught = ["r"]
estimated_time_seconds = 15

[[scenarios]]
id = "change_selection_001"
name = "Change character"
description = "Delete character under cursor and enter insert mode"

hints = [
    "'c' deletes the selection and enters insert mode",
    "It's like 'd' followed by 'i'",
    "Don't forget to press Escape to exit insert mode",
]

[scenarios.setup]
file_content = """fn validate(data: &Data) -> bool {
    let name = data.get("name");
    let id = data.id;

    name.len() > 0
}"""
cursor_position = [2, 8]

[scenarios.target]
file_content = """fn validate(data: &Data) -> bool {
    let name = data.get("name");
    let key = data.id;

    name.len() > 0
}"""
cursor_position = [2, 11]

[scenarios.solution]
commands = ["e", "c", "k", "e", "y", "Escape"]
description = "Press 'e' to select 'id', 'c' to change, type 'key', then Escape"

[scenarios.scoring]
optimal_count = 6
max_points = 100
tolerance = 1

[scenarios.metadata]
category = "editing"
difficulty = "beginner"
tags = ["change", "replace"]
commands_taught = ["c"]
estimated_time_seconds = 20
