# Basic Insert Operations
# Scenarios covering various insert modes and line operations

[[scenarios]]
id = "append_mode_001"
name = "Append after cursor"
description = "Enter insert mode after cursor position"

hints = [
    "'a' enters insert mode after the cursor position",
    "Don't forget to press Escape to exit insert mode",
]

[scenarios.setup]
file_content = """fn main() {
    let x = 0;
    println!("{}", x);
}"""
cursor_position = [1, 8]

[scenarios.target]
file_content = """fn main() {
    let xy = 0;
    println!("{}", x);
}"""
cursor_position = [1, 10]

[scenarios.solution]
commands = ["a", "y", "Escape"]
description = "Press 'a' to append, type 'y', Escape to exit"

[scenarios.scoring]
optimal_count = 3
max_points = 100
tolerance = 1

[scenarios.metadata]
category = "editing"
difficulty = "beginner"
tags = ["insert", "append"]
commands_taught = ["a"]
estimated_time_seconds = 10

[[scenarios]]
id = "open_below_001"
name = "Insert line below"
description = "Open a new line below the current line"

hints = [
    "'o' inserts a new line below and enters insert mode",
    "Don't forget to press Escape to exit insert mode",
]

[scenarios.setup]
file_content = """fn add(a: i32, b: i32) -> i32 {
    a + b
}"""
cursor_position = [0, 0]

[scenarios.target]
file_content = """fn add(a: i32, b: i32) -> i32 {

    a + b
}"""
cursor_position = [1, 0]

[scenarios.solution]
commands = ["o", "Escape"]
description = "Press 'o' to open line below, then Escape"

[scenarios.scoring]
optimal_count = 2
max_points = 100
tolerance = 1

[scenarios.metadata]
category = "editing"
difficulty = "beginner"
tags = ["insert", "line", "open"]
commands_taught = ["o"]
estimated_time_seconds = 10

[[scenarios]]
id = "open_above_001"
name = "Insert line above"
description = "Open a new line above the current line"

hints = [
    "'O' inserts a new line above and enters insert mode",
    "Don't forget to press Escape to exit insert mode",
]

[scenarios.setup]
file_content = """fn main() {
    println!("Hello");
}"""
cursor_position = [1, 4]

[scenarios.target]
file_content = """fn main() {

    println!("Hello");
}"""
cursor_position = [1, 0]

[scenarios.solution]
commands = ["O", "Escape"]
description = "Press 'O' to open line above, then Escape"

[scenarios.scoring]
optimal_count = 2
max_points = 100
tolerance = 1

[scenarios.metadata]
category = "editing"
difficulty = "beginner"
