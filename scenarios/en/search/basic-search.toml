[scenarios.target]
file_content = """fn add(val: i32, b: i32) -> i32 {
    val + b
}
fn sub(val: i32, b: i32) -> i32 {
    val - b
}"""
selection = [1, 4, 1, 7]

[scenarios.solution]
commands = ["miw", "*", "n"]
description = "Select 'val' with 'miw', press '*' to search for it, then 'n' to find the next match"

[scenarios.scoring]
optimal_count = 3
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "search"
difficulty = "beginner"
tags = ["search", "next", "match"]
commands_taught = ["*"]

[[scenarios]]
