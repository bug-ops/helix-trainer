# Basic Search Commands
# Scenarios for *, #, n, N search commands

# ============================================================================
# SEARCH WORD UNDER CURSOR (* command)
# ============================================================================

[[scenarios]]
id = "search_word_001"
name = "Search word forward"
description = "Use '*' to search for the word under cursor"

hints = [
    "'*' searches forward for word under cursor",
    "The search includes word boundaries",
]

[scenarios.setup]
file_content = "hello world hello there"
cursor_position = [0, 0]

[scenarios.target]
file_content = "hello world hello there"
cursor_position = [0, 12]
selection = [0, 12, 0, 17]

[scenarios.solution]
commands = ["*"]
description = "Press '*' to jump to next occurrence of 'hello'"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "search"
difficulty = "beginner"
tags = ["search", "word", "forward"]
commands_taught = ["*"]
estimated_time_seconds = 10

[[scenarios]]
id = "search_word_002"
name = "Search word multiple times"
description = "Use '*' and 'n' to navigate through matches"

hints = [
    "'*' starts the search for word under cursor",
    "'n' jumps to the next match",
]

[scenarios.setup]
file_content = "foo bar foo baz foo"
cursor_position = [0, 0]

[scenarios.target]
file_content = "foo bar foo baz foo"
cursor_position = [0, 16]
selection = [0, 16, 0, 19]

[scenarios.solution]
commands = ["*", "n"]
description = "Press '*' then 'n' to reach the third 'foo'"

[scenarios.scoring]
optimal_count = 2
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "search"
difficulty = "beginner"
tags = ["search", "word", "next"]
commands_taught = ["*", "n"]
estimated_time_seconds = 15

