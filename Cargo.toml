[package]
name = "helix-trainer"
version = "0.5.8"
edition = "2024"
rust-version = "1.89"
authors = ["Andrei G <andrei.g@my.com>"]
description = "Interactive trainer for learning Helix editor keybindings"
license = "MIT"
repository = "https://github.com/bug-ops/helix-trainer"

[features]
default = ["audio"]
audio = ["rodio"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6.0"
fsrs = "5.2"
futures = "0.3"
helix-core = { git = "https://github.com/helix-editor/helix", tag = "25.07.1" }
rand = "0.10"
ratatui = "0.30"
rodio = { version = "0.21", default-features = false, features = ["vorbis", "playback"], optional = true }
rust-i18n = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syntect = { version = "5.3", default-features = false, features = ["default-themes", "default-syntaxes", "regex-onig"] }
thiserror = "2.0"
tokio = { version = "1.49", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tui-big-text = "0.8.2"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
dhat = "0.3"
proptest = "1.10"
regex = "1.12"
tempfile = "3.25"
walkdir = "2.5"

[[bin]]
name = "helix-trainer"
path = "src/main.rs"

[[bench]]
name = "xp_scaling"
harness = false

[[bench]]
name = "filtering_sorting"
harness = false

[profile.release]
opt-level = "z"        # Optimize for size
lto = "fat"            # Full Link-Time Optimization for maximum size reduction
codegen-units = 1      # Single codegen unit for better optimization
strip = true           # Strip symbols from binary
panic = "abort"        # Abort on panic (no unwinding = smaller binary)
