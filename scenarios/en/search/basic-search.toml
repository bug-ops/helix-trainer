# Basic Search Commands
# Scenarios for *, n, N search commands

[[scenarios]]
id = "search_word_001"
name = "Search word forward"
description = "Use '*' to search for the word under cursor"

hints = [
    "'*' searches forward for word under cursor",
    "The search includes word boundaries",
]

[scenarios.setup]
file_content = """fn main() {
    let count = 0;
    for i in 0..10 {
        count += 1;
    }
    println!("{}", count);
}"""
cursor_position = [1, 8]

[scenarios.target]
file_content = """fn main() {
    let count = 0;
    for i in 0..10 {
        count += 1;
    }
    println!("{}", count);
}"""
cursor_position = [3, 8]
selection = [3, 8, 3, 13]

[scenarios.solution]
commands = ["*"]
description = "Press '*' to jump to next occurrence of 'count'"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "search"
difficulty = "beginner"
tags = ["search", "word", "forward"]
commands_taught = ["*"]
estimated_time_seconds = 10

[[scenarios]]
id = "search_word_002"
name = "Search word multiple times"
description = "Use '*' and 'n' to navigate through matches"

hints = [
    "'*' starts the search for word under cursor",
    "'n' jumps to the next match",
]

[scenarios.setup]
file_content = """fn process(data: &str) {
    let data = data.trim();
    println!("{}", data);
}"""
cursor_position = [0, 11]

[scenarios.target]
file_content = """fn process(data: &str) {
    let data = data.trim();
    println!("{}", data);
}"""
cursor_position = [1, 19]
selection = [1, 15, 1, 19]

[scenarios.solution]
commands = ["*", "n"]
description = "Press '*' then 'n' to reach the third 'data'"

[scenarios.scoring]
optimal_count = 2
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "search"
difficulty = "beginner"
tags = ["search", "word", "next"]
commands_taught = ["*", "n"]
estimated_time_seconds = 15

[[scenarios]]
id = "search_next_001"
name = "Go to next match"
description = "Use '*' to search for word under cursor"

hints = [
    "'*' searches for the word under cursor",
    "Jumps to the next occurrence",
]

[scenarios.setup]
file_content = """fn add(a: i32, b: i32) -> i32 {
    a + b
}
fn sub(a: i32, b: i32) -> i32 {
    a - b
}"""
cursor_position = [0, 7]

[scenarios.target]
file_content = """fn add(a: i32, b: i32) -> i32 {
    a + b
}
fn sub(a: i32, b: i32) -> i32 {
    a - b
}"""
cursor_position = [1, 5]
selection = [1, 4, 1, 5]

[scenarios.solution]
commands = ["*"]
description = "Press '*' to find next 'a'"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "search"
difficulty = "beginner"
tags = ["search", "next", "match"]
commands_taught = ["*"]
estimated_time_seconds = 10


