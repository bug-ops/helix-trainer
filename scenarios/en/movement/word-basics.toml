# Word Movement Basics
# Scenarios for w, b navigation

[[scenarios]]
id = "word_forward_basic_001"
name = "Move forward one word"
description = "Use 'w' to jump to next word start"

hints = [
    "'w' moves to the start of the next word",
    "Spaces separate words",
]

[scenarios.setup]
file_content = "Hello World"
cursor_position = [0, 0]

[scenarios.target]
file_content = "Hello World"
cursor_position = [0, 6]

[scenarios.solution]
commands = ["w"]
description = "Press 'w' to move to next word"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "movement"
difficulty = "beginner"
tags = ["word", "forward"]
commands_taught = ["w"]
estimated_time_seconds = 5

[[scenarios]]
id = "word_forward_basic_002"
name = "Move forward two words"
description = "Jump through two words using 'w'"

hints = [
    "'w' moves to next word start",
    "Press twice for two words",
]

[scenarios.setup]
file_content = "one two three"
cursor_position = [0, 0]

[scenarios.target]
file_content = "one two three"
cursor_position = [0, 8]

[scenarios.solution]
commands = ["w", "w"]
description = "Press 'w' twice"

[scenarios.scoring]
optimal_count = 2
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "movement"
difficulty = "beginner"
tags = ["word", "forward"]
commands_taught = ["w"]
estimated_time_seconds = 10

