[package]
name = "helix-trainer"
version = "0.6.2"
edition = "2024"
rust-version = "1.98"
authors = ["Andrei G <andrei.g@my.com>"]
description = "Interactive trainer for learning Helix editor keybindings"
license = "MIT"
repository = "https://github.com/bug-ops/helix-trainer"

[features]
default = ["audio"]
audio = ["rodio"]
test-util = []

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7.0"
fsrs = "7"
futures = "0.3"
helix-core = { git = "https://github.com/helix-editor/helix", tag = "25.07.1" }
helix-stdx = { git = "https://github.com/helix-editor/helix", tag = "25.07.1" }
rand = "0.10"
ratatui = "0.30"
rodio = { version = "0.23", default-features = false, features = ["vorbis", "playback"], optional = true }
rust-i18n = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syntect = { version = "5.3", default-features = false, features = ["default-themes", "default-syntaxes", "regex-fancy"] }
thiserror = "2.0"
tokio = { version = "1.54", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tui-big-text = "0.8"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
dhat = "0.3"
helix-trainer = { path = ".", default-features = false, features = ["test-util"] }
proptest = "1.12"
proc-macro2 = "1"
regex = "1.13"
syn = { version = "3.0", features = ["full", "visit"] }
tempfile = "3.27"
walkdir = "2.5"

[[bin]]
name = "helix-trainer"
path = "src/main.rs"

[[test]]
name = "fsrs_equivalence"
required-features = ["test-util"]

[[test]]
name = "gamification"
required-features = ["test-util"]

[[bench]]
name = "xp_scaling"
harness = false

[[bench]]
name = "filtering_sorting"
harness = false

[profile.release]
opt-level = "z"        # Optimize for size
lto = "fat"            # Full Link-Time Optimization for maximum size reduction
codegen-units = 1      # Single codegen unit for better optimization
strip = true           # Strip symbols from binary
panic = "abort"        # Abort on panic (no unwinding = smaller binary)

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
redundant_clone = "warn"
cast_possible_truncation = "warn"
unnecessary_wraps = "warn"
# Pedantic lints kept allowed on purpose.
assert_is_empty = "allow" # fixing 100+ test assertions hurts readability
match_same_arms = "allow" # exhaustive per-variant mappings stay explicit
module_name_repetitions = "allow" # 71 public names, renaming adds churn without safety gain
must_use_candidate = "allow" # 461 sites, attribute noise outweighs the benefit
similar_names = "allow" # name heuristic, renames give no benefit
too_many_lines = "allow" # needs dedicated function-splitting refactors
