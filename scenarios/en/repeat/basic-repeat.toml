# Repeat Command Scenarios
# Scenarios demonstrating the '.' (repeat) command for replaying last action

[[scenarios]]
id = "repeat_delete_char_001"
name = "Repeat character deletion"
description = "Delete a character, then repeat the deletion with the '.' command"

hints = [
    "The '.' command repeats the last editing action",
    "First delete one character with 'd'",
    "Then press '.' to repeat the deletion",
]

[scenarios.setup]
file_content = "hello world"
cursor_position = [0, 0]

[scenarios.target]
file_content = "llo world"
cursor_position = [0, 0]

[scenarios.solution]
commands = ["d", "."]
description = "Press 'd' to delete 'h', then '.' to repeat and delete 'e'"

[scenarios.scoring]
optimal_count = 2
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "advanced"
difficulty = "intermediate"
tags = ["repeat", "delete"]
commands_taught = ["."]
estimated_time_seconds = 25

[[scenarios]]
id = "repeat_delete_line_001"
name = "Repeat line deletion"
description = "Delete a line with 'xd', then repeat to delete another line"

hints = [
    "Use 'x' to select the current line, then 'd' to delete it",
    "The '.' command will repeat the entire 'xd' operation",
    "Two line deletes with just three keystrokes after the first!",
]

[scenarios.setup]
file_content = "line 1\nline 2\nline 3\nline 4"
cursor_position = [0, 0]

[scenarios.target]
file_content = "line 3\nline 4"
cursor_position = [0, 0]

[scenarios.solution]
commands = ["x", "d", "."]
description = "Press 'x' to select line, 'd' to delete, then '.' to repeat xd"

[scenarios.scoring]
optimal_count = 3
max_points = 100
tolerance = 1

[scenarios.metadata]
category = "advanced"
difficulty = "intermediate"
tags = ["repeat", "delete", "line", "selection"]
commands_taught = [".", "x", "d"]
estimated_time_seconds = 30

[[scenarios]]
id = "repeat_insert_001"
name = "Repeat append at same position"
description = "Use 'a' to append text, then repeat with '.'"

hints = [
    "The repeat command replays the last insert action",
    "'.' repeats the last editing action",
]

[scenarios.setup]
file_content = "ab"
cursor_position = [0, 0]

[scenarios.target]
file_content = "axbx"
cursor_position = [0, 4]

[scenarios.solution]
commands = ["a", "x", "Escape", "."]
description = "Append 'x' after 'a', then repeat with '.' to add another 'x'"

[scenarios.scoring]
optimal_count = 4
max_points = 100
tolerance = 1

[scenarios.metadata]
category = "advanced"
difficulty = "intermediate"
tags = ["repeat", "insert"]
commands_taught = ["."]
estimated_time_seconds = 10


[[scenarios]]
id = "repeat_indent_001"
name = "Repeat indentation"
description = "Indent a line, then repeat to indent additional lines"

hints = [
    "The '>' command indents the current line",
    "After indenting, the '.' command will repeat the indentation",
    "Navigate between lines with 'j' (down)",
]

[scenarios.setup]
file_content = "def foo():\nprint('hello')\nprint('world')\nreturn"
cursor_position = [1, 0]

[scenarios.target]
file_content = "def foo():\n  print('hello')\n  print('world')\nreturn"
cursor_position = [2, 4]

[scenarios.solution]
commands = [">", "j", "."]
description = "Indent line 2 with '>', move down with 'j', repeat indentation with '.'"

[scenarios.scoring]
optimal_count = 3
max_points = 100
tolerance = 2

[scenarios.metadata]
category = "advanced"
difficulty = "intermediate"
tags = ["repeat", "indent"]
commands_taught = ["."]
estimated_time_seconds = 35

[[scenarios]]
id = "repeat_replace_001"
name = "Repeat character replacement"
description = "Replace a character, then repeat the replacement elsewhere"

hints = [
    "The 'r' command replaces a single character",
    "Format: 'r' followed by the new character (e.g., 'r_')",
    "Use 'l' to move right to the next '-'",
    "Press '.' to repeat the replacement",
]

[scenarios.setup]
file_content = "foo-bar-baz"
cursor_position = [0, 3]

[scenarios.target]
file_content = "foo_bar_baz"
cursor_position = [0, 7]

[scenarios.solution]
commands = ["r_", "l", "l", "l", "l", "."]
description = "Replace '-' with '_' using 'r_', move to next '-' with 'llll', repeat with '.'"

[scenarios.scoring]
optimal_count = 7
max_points = 100
tolerance = 3
[scenarios.metadata]
category = "advanced"
difficulty = "intermediate"
tags = ["repeat", "replace"]
commands_taught = ["."]
estimated_time_seconds = 30
