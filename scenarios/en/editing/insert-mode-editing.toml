# Insert Mode Editing Keys
# Scenarios for Ctrl-w, Ctrl-k and Alt-Backspace while typing

[[scenarios]]
id = "insert_delete_word_001"
name = "Delete a mistyped word with Ctrl-w"
description = "Remove a wrongly typed word without leaving Insert mode"

hints = [
    "'A' appends at the end of the line",
    "'Ctrl-w' deletes the word before the cursor in Insert mode",
    "It is shorter than pressing Backspace once per letter",
]

[scenarios.setup]
file_content = """total"""
cursor_position = [0, 0]

[scenarios.target]
file_content = """total ok"""
cursor_position = [0, 8]

[scenarios.solution]
commands = ["A", " ", "w", "r", "o", "n", "g", "Ctrl-w", "o", "k", "Escape"]
description = "Append ' wrong', erase it with 'Ctrl-w', then type 'ok'"

[scenarios.scoring]
optimal_count = 11
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "editing"
difficulty = "intermediate"
tags = ["insert-mode", "delete", "word"]
commands_taught = ["Ctrl-w"]

[[scenarios]]
id = "insert_delete_to_end_001"
name = "Delete to line end with Ctrl-k"
description = "Replace the tail of a line without leaving Insert mode"

hints = [
    "'i' inserts before the cursor",
    "'Ctrl-k' deletes from the cursor to the end of the line in Insert mode",
]

[scenarios.setup]
file_content = """name = old value here"""
cursor_position = [0, 7]

[scenarios.target]
file_content = """name = new"""
cursor_position = [0, 10]

[scenarios.solution]
commands = ["i", "Ctrl-k", "n", "e", "w", "Escape"]
description = "Press 'i', erase the rest of the line with 'Ctrl-k', type 'new', then Escape"

[scenarios.scoring]
optimal_count = 6
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "editing"
difficulty = "intermediate"
tags = ["insert-mode", "delete", "line-end"]
commands_taught = ["Ctrl-k"]

[[scenarios]]
id = "insert_alt_backspace_001"
name = "Delete a mistyped word with Alt-Backspace"
description = "Remove a wrongly typed word in Insert mode with 'Alt-Backspace'"

hints = [
    "'A' appends at the end of the line",
    "'Alt-Backspace' deletes the word before the cursor in Insert mode",
]

[scenarios.setup]
file_content = """cargo"""
cursor_position = [0, 0]

[scenarios.target]
file_content = """cargo done"""
cursor_position = [0, 10]

[scenarios.solution]
commands = ["A", " ", "t", "y", "p", "o", "Alt-Backspace", "d", "o", "n", "e", "Escape"]
description = "Append ' typo', erase it with 'Alt-Backspace', then type 'done'"

[scenarios.scoring]
optimal_count = 12
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "editing"
difficulty = "intermediate"
tags = ["insert-mode", "delete", "word"]
commands_taught = ["Alt-Backspace"]
