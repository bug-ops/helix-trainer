# Macro Recording and Replay Scenarios
# Scenarios demonstrating 'q' (toggle macro recording) and 'Q' (replay the
# recorded macro).

[[scenarios]]
id = "macro_delete_lines_001"
name = "Record and replay a line-delete macro"
description = "Record a line-delete with 'q', then replay it with 'Q' to delete another line"

hints = [
    "'q' toggles macro recording on and off",
    "Record 'x' (select line) then 'd' (delete) between the two 'q' presses",
    "'Q' replays everything that was recorded",
]

[scenarios.setup]
file_content = """line 1
line 2
line 3
line 4"""
cursor_position = [0, 0]

[scenarios.target]
file_content = """line 3
line 4"""
cursor_position = [0, 0]

[scenarios.solution]
commands = ["q", "x", "d", "q", "Q"]
description = "Record 'xd' (select line, delete) between two 'q' presses, then 'Q' to replay it once more"

[scenarios.scoring]
optimal_count = 5
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "advanced"
difficulty = "intermediate"
tags = ["macro", "delete", "line"]
commands_taught = ["q", "Q"]
estimated_time_seconds = 25

[[scenarios]]
id = "macro_append_lines_001"
name = "Record and replay an append macro"
description = "Record appending '!' to a line end with 'q', then replay with 'Q' on the next line"

hints = [
    "'q' toggles macro recording on and off",
    "Record 'A!Escape' (append '!' at line end) followed by 'j' and 'gh' to move to the next line",
    "'Q' replays the whole recorded sequence on the new line",
]

[scenarios.setup]
file_content = """foo
bar
baz"""
cursor_position = [0, 0]

[scenarios.target]
file_content = """foo!
bar!
baz"""
cursor_position = [2, 0]

[scenarios.solution]
commands = ["q", "A", "!", "Escape", "j", "gh", "q", "Q"]
description = "Record appending '!' and moving to the next line, then 'Q' to replay it once more"

[scenarios.scoring]
optimal_count = 9
max_points = 100
tolerance = 1

[scenarios.metadata]
category = "advanced"
difficulty = "intermediate"
tags = ["macro", "insert", "append"]
commands_taught = ["q", "Q"]
estimated_time_seconds = 35
