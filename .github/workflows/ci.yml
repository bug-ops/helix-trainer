name: CI

# Minimal permissions for security best practices
permissions:
  contents: read
  # All other permissions are implicitly set to none

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      # true when files that affect compiled behavior changed: source, scenarios
      # (compile-time embedded, see src/config/scenarios.rs), locales (compile-time
      # codegen via rust_i18n::i18n! in src/lib.rs), manifests, or the CI workflow itself.
      run-heavy: ${{ steps.filter.outputs.rust == 'true' || steps.filter.outputs.ci == 'true' }}
      install-script: ${{ steps.filter.outputs.install-script }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - 'src/**'
              - 'scenarios/**'
              - 'locales/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'tests/**'
              - 'benches/**'
              - '.cargo/**'
              - 'rust-toolchain*'
            ci:
              - '.github/workflows/**'
            install-script:
              - 'install.sh'

  test:
    name: Test Suite
    needs: [changes]
    if: needs.changes.outputs.run-heavy == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test-${{ matrix.os }}"

      - name: Install ALSA development libraries (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests
        run: cargo nextest run --workspace --all-features --lib --bins --tests --verbose

      - name: Run doc tests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --doc --verbose

      - name: Check benchmarks compile
        if: matrix.os == 'ubuntu-latest'
        run: cargo bench --no-run

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo +nightly fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "clippy"

      - name: Install ALSA development libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Security audit with cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  shellcheck:
    name: Shellcheck (install.sh)
    needs: [changes]
    if: needs.changes.outputs.install-script == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          ignore_paths: 'target scenarios locales'

  msrv:
    name: Check MSRV
    needs: [changes]
    if: needs.changes.outputs.run-heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          MSRV=$(grep '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$MSRV" >> $GITHUB_OUTPUT
          echo "Detected MSRV: $MSRV"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "msrv"

      - name: Install ALSA development libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Check with MSRV
        run: cargo check --all-features --verbose

  build:
    name: Build
    needs: [changes]
    if: needs.changes.outputs.run-heavy == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build-${{ matrix.os }}"

      - name: Install ALSA development libraries (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install cargo-bloat (Linux only)
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-bloat

      - name: Build release
        run: cargo build --release --verbose

      - name: Binary size analysis (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          echo "=== Binary Size Report (${{ matrix.os }}) ==="
          BINARY_PATH="target/release/helix-trainer"

          if [ -f "$BINARY_PATH" ]; then
            # Get file size
            SIZE=$(ls -lh "$BINARY_PATH" | awk '{print $5}')
            SIZE_BYTES=$(stat -f%z "$BINARY_PATH" 2>/dev/null || stat -c%s "$BINARY_PATH" 2>/dev/null)
            SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1024 / 1024" | bc)

            echo "Binary: $BINARY_PATH"
            echo "Size: $SIZE ($SIZE_MB MB)"
            echo "Size (bytes): $SIZE_BYTES"
            echo ""

            # Check if stripped (Unix)
            if file "$BINARY_PATH" | grep -q "not stripped"; then
              echo "⚠️  Warning: Binary is NOT stripped (strip=true in Cargo.toml should handle this)"
            else
              echo "✓ Binary is stripped"
            fi

            # Show section sizes (Unix)
            echo ""
            echo "=== Section Sizes ==="
            size "$BINARY_PATH" || true
          else
            echo "❌ Binary not found at $BINARY_PATH"
            exit 1
          fi

      - name: Binary size analysis (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "=== Binary Size Report (${{ matrix.os }}) ==="
          $BinaryPath = "target/release/helix-trainer.exe"

          if (Test-Path $BinaryPath) {
            $FileInfo = Get-Item $BinaryPath
            $SizeBytes = $FileInfo.Length
            $SizeMB = [math]::Round($SizeBytes / 1MB, 2)

            Write-Host "Binary: $BinaryPath"
            Write-Host "Size: $SizeMB MB"
            Write-Host "Size (bytes): $SizeBytes"
            Write-Host ""

            Write-Host "File details:"
            Get-Item $BinaryPath | Format-List Name, Length, LastWriteTime
          } else {
            Write-Host "❌ Binary not found at $BinaryPath"
            exit 1
          }

      - name: Analyze binary bloat (Linux only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          echo ""
          echo "=== Top 20 Functions by Size ==="
          cargo bloat --release -n 20 || true

          echo ""
          echo "=== Crate Size Breakdown ==="
          cargo bloat --release --crates -n 20 || true

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: helix-trainer-${{ matrix.os }}
          path: |
            target/release/helix-trainer
            target/release/helix-trainer.exe
          retention-days: 7
          if-no-files-found: ignore

  coverage:
    name: Generate Coverage Report
    needs: [changes]
    if: needs.changes.outputs.run-heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "coverage"

      - name: Install ALSA development libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Generate coverage report
        run: |
          cargo llvm-cov --all-features --workspace --lcov \
            --output-path lcov.info nextest --verbose

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
          verbose: true
          flags: unittests
          name: helix-trainer-coverage

      - name: Archive coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 30

  gate:
    name: CI Gate
    if: always()
    needs: [changes, test, fmt, clippy, security, shellcheck, msrv, build, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          # `changes` and the always-on jobs (fmt/clippy/security) must succeed outright.
          # test/msrv/build/coverage are gated behind changes.outputs.run-heavy: a
          # "skipped" result is only acceptable for them when run-heavy is exactly
          # "false", i.e. the path filter deliberately excluded the job. If run-heavy
          # was "true" (or the changes job itself failed), "skipped" here means the
          # job never ran despite being required, so it must fail the gate.
          changes_result="${{ needs.changes.result }}"
          run_heavy="${{ needs.changes.outputs.run-heavy }}"
          install_script="${{ needs.changes.outputs.install-script }}"

          if [[ "$changes_result" != "success" ]]; then
            echo "::error::changes detection job failed or was cancelled"
            exit 1
          fi

          fail=0

          check_required() {
            local name="$1" result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::$name failed or was cancelled"
              fail=1
            fi
          }

          check_gated() {
            local name="$1" result="$2" gate_value="$3"
            if [[ "$result" == "success" ]]; then
              return
            fi
            if [[ "$result" == "skipped" && "$gate_value" == "false" ]]; then
              return
            fi
            echo "::error::$name failed, was cancelled, or was skipped unexpectedly"
            fail=1
          }

          check_required "fmt" "${{ needs.fmt.result }}"
          check_required "clippy" "${{ needs.clippy.result }}"
          check_required "security" "${{ needs.security.result }}"
          check_gated "test" "${{ needs.test.result }}" "$run_heavy"
          check_gated "msrv" "${{ needs.msrv.result }}" "$run_heavy"
          check_gated "build" "${{ needs.build.result }}" "$run_heavy"
          check_gated "coverage" "${{ needs.coverage.result }}" "$run_heavy"
          check_gated "shellcheck" "${{ needs.shellcheck.result }}" "$install_script"

          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi
          echo "All CI jobs passed (or were correctly skipped for docs-only changes)"
