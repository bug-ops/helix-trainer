# Basic Search Commands
# Scenarios for *, n, N search commands

[[scenarios]]
id = "search_word_001"
name = "Search word forward"
description = "Select a word, use '*' to search for it, then jump to the next match"

hints = [
    "'miw' selects the word under the cursor",
    "'*' uses the current selection as the search pattern, adding word boundaries where it starts or ends a word",
    "'n' jumps to the next match",
]

[scenarios.setup]
file_content = """fn main() {
    let count = 0;
    for i in 0..10 {
        count += 1;
    }
    println!("{}", count);
}"""
cursor_position = [1, 8]

[scenarios.target]
file_content = """fn main() {
    let count = 0;
    for i in 0..10 {
        count += 1;
    }
    println!("{}", count);
}"""
selection = [3, 8, 3, 13]

[scenarios.solution]
commands = ["miw", "*", "n"]
description = "Select 'count' with 'miw', press '*' to search for it, then 'n' to jump to the next occurrence"

[scenarios.scoring]
optimal_count = 3
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "search"
difficulty = "beginner"
tags = ["search", "word", "forward"]
commands_taught = ["*"]

[[scenarios]]
id = "search_word_002"
name = "Search word multiple times"
description = "Select a word, use '*' and 'n' to navigate through matches"

hints = [
    "'miw' selects the word under the cursor",
    "'*' uses the selection as the search pattern; it does not move",
    "'n' jumps to the next match",
]

[scenarios.setup]
file_content = """fn process(data: &str) {
    let data = data.trim();
    println!("{}", data);
}"""
cursor_position = [0, 11]

[scenarios.target]
file_content = """fn process(data: &str) {
    let data = data.trim();
    println!("{}", data);
}"""
selection = [1, 15, 1, 19]

[scenarios.solution]
commands = ["miw", "*", "n", "n"]
description = "Select 'data' with 'miw', press '*' to search for it, then 'n' twice to reach the third 'data'"

[scenarios.scoring]
optimal_count = 4
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "search"
difficulty = "beginner"
tags = ["search", "word", "next"]
commands_taught = ["*", "n"]

[[scenarios]]
id = "search_next_001"
name = "Go to next match"
description = "Select a word, search for it with '*' and jump to its next occurrence"

hints = [
    "'miw' selects the word under the cursor",
    "'*' uses the selection as the search pattern, 'n' jumps to the next occurrence",
]

[scenarios.setup]
file_content = """fn add(val: i32, b: i32) -> i32 {
    val + b
}
fn sub(val: i32, b: i32) -> i32 {
    val - b
}"""
cursor_position = [0, 7]

[scenarios.target]
file_content = """fn add(val: i32, b: i32) -> i32 {
    val + b
}
fn sub(val: i32, b: i32) -> i32 {
    val - b
}"""
selection = [1, 4, 1, 7]

[scenarios.solution]
commands = ["miw", "*", "n"]
description = "Select 'val' with 'miw', press '*' to search for it, then 'n' to find the next match"

[scenarios.scoring]
optimal_count = 3
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "search"
difficulty = "beginner"
tags = ["search", "next", "match"]
commands_taught = ["*"]

[[scenarios]]
id = "search_prev_001"
name = "Search word backward"
description = "Select a word, search for it with '*' and use 'N' to go backward through occurrences"

hints = [
    "'miw' selects the word under the cursor",
    "'*' uses the selection as the search pattern",
    "'N' jumps to the previous match (wrapping to the last one)",
]

[scenarios.setup]
file_content = """fn main() {
    let count = 0;
    for i in 0..10 {
        count += 1;
    }
    println!("{}", count);
}"""
cursor_position = [1, 8]

[scenarios.target]
file_content = """fn main() {
    let count = 0;
    for i in 0..10 {
        count += 1;
    }
    println!("{}", count);
}"""
selection = [5, 19, 5, 24]

[scenarios.solution]
commands = ["miw", "*", "N"]
description = "Select 'count' with 'miw', press '*' to search for it, then 'N' to go backward to the last occurrence"

[scenarios.scoring]
optimal_count = 3
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "search"
difficulty = "beginner"
tags = ["search", "word", "backward", "prev"]
commands_taught = ["*", "N"]


[[scenarios]]
id = "search_backward_001"
name = "Search backward"
description = "Use '?' to search backward for a pattern from the cursor"

hints = [
    "'?' opens a backward search prompt",
    "Type the pattern and confirm with Enter",
    "The previous match before the cursor is selected",
]

[scenarios.setup]
file_content = """foo bar foo baz foo"""
cursor_position = [0, 13]

[scenarios.target]
file_content = """foo bar foo baz foo"""
selection = [0, 8, 0, 11]

[scenarios.solution]
commands = ["? foo"]
description = "Press '?', type 'foo' and confirm to select the match before the cursor"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "search"
difficulty = "intermediate"
tags = ["search", "backward"]
commands_taught = ["?"]

[[scenarios]]
id = "search_backward_002"
name = "Backward search, then forward"
description = "Search backward with '?', then use 'n' to go forward past the cursor"

hints = [
    "'?' searches backward and selects the previous match",
    "'n' always searches forward, even after a backward search",
]

[scenarios.setup]
file_content = """foo bar foo baz foo"""
cursor_position = [0, 13]

[scenarios.target]
file_content = """foo bar foo baz foo"""
selection = [0, 16, 0, 19]

[scenarios.solution]
commands = ["? foo", "n"]
description = "Press '?' and confirm 'foo' to select the previous match, then 'n' to move forward to the last one"

[scenarios.scoring]
optimal_count = 2
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "search"
difficulty = "intermediate"
tags = ["search", "backward", "next"]
commands_taught = ["?", "n"]

[[scenarios]]
id = "search_selection_001"
name = "Search for a selection as a substring"
description = "Use 'Alt-*' to search for the selection without word boundaries"

hints = [
    "'miw' selects the word under the cursor",
    "'Alt-*' uses the selection as the search pattern exactly, without word boundaries",
    "'n' jumps to the next match, even inside a longer word",
]

[scenarios.setup]
file_content = """count discount counter"""
cursor_position = [0, 0]

[scenarios.target]
file_content = """count discount counter"""
selection = [0, 9, 0, 14]

[scenarios.solution]
commands = ["miw", "Alt-*", "n"]
description = "Select 'count' with 'miw', press 'Alt-*' to search for it as a substring, then 'n' to reach the match inside 'discount'"

[scenarios.scoring]
optimal_count = 3
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "search"
difficulty = "intermediate"
tags = ["search", "selection", "substring"]
commands_taught = ["Alt-*", "n"]
