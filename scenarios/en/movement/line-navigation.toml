# Line Navigation
# Scenarios for 0, $, gg, G commands

[[scenarios]]
id = "line_start_basic_001"
name = "Move to line start"
description = "Use '0' to jump to beginning of line"

hints = [
    "'0' moves cursor to column 0",
    "Works on any line",
]

[scenarios.setup]
file_content = "Hello World"
cursor_position = [0, 6]

[scenarios.target]
file_content = "Hello World"
cursor_position = [0, 0]

[scenarios.solution]
commands = ["gh"]
description = "Press '0' to go to line start"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "movement"
difficulty = "beginner"
tags = ["line", "start"]
commands_taught = ["gh"]
estimated_time_seconds = 5

