# Scrolling / Page Movement
# Scenarios for Ctrl-d, Ctrl-u, Ctrl-f, Ctrl-b (half-page/page movement)
# NOTE: this simulator moves the cursor by a fixed line delta (page = 20 lines,
# half-page = 10 lines) rather than deriving it from a real terminal viewport
# height, since no viewport/scroll-offset is tracked by the scenario scorer.

[[scenarios]]
id = "scroll_half_page_down_001"
name = "Scroll half page down"
description = "Use 'Ctrl-d' to move the cursor down half a page"

hints = [
    "'Ctrl-d' moves the cursor down about half a screen",
    "The column position is preserved when possible",
]

[scenarios.setup]
file_content = """line 01
line 02
line 03
line 04
line 05
line 06
line 07
line 08
line 09
line 10
line 11
line 12
line 13
line 14
line 15
line 16
line 17
line 18
line 19
line 20
line 21
line 22
line 23
line 24
line 25
line 26
line 27
line 28
line 29
line 30"""
cursor_position = [0, 5]

[scenarios.target]
file_content = """line 01
line 02
line 03
line 04
line 05
line 06
line 07
line 08
line 09
line 10
line 11
line 12
line 13
line 14
line 15
line 16
line 17
line 18
line 19
line 20
line 21
line 22
line 23
line 24
line 25
line 26
line 27
line 28
line 29
line 30"""
cursor_position = [10, 5]

[scenarios.solution]
commands = ["Ctrl-d"]
description = "Press 'Ctrl-d' to scroll half a page down"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "movement"
difficulty = "intermediate"
tags = ["scroll", "page", "viewport"]
commands_taught = ["Ctrl-d"]
estimated_time_seconds = 8

