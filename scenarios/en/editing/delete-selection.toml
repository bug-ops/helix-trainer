# Delete Selection Commands
# Scenarios for d (delete selection), xd (select line + delete)

[[scenarios]]
id = "delete_selection_001"
name = "Delete single character"
description = "Use 'd' to delete the character under cursor"

hints = [
    "'d' deletes the current selection",
    "Default selection is one character",
]

[scenarios.setup]
file_content = """fn main() {
    let mut x = 0;
    x += 1;
}"""
cursor_position = [1, 8]

[scenarios.target]
file_content = """fn main() {
    let ut x = 0;
    x += 1;
}"""
cursor_position = [1, 8]

[scenarios.solution]
commands = ["d"]
description = "Press 'd' to delete selection"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "editing"
difficulty = "beginner"
tags = ["delete", "selection"]
commands_taught = ["d"]
estimated_time_seconds = 5

[[scenarios]]
id = "delete_selection_002"
name = "Delete character in middle"
description = "Delete a character from middle of word"

hints = [
    "'d' deletes whatever is selected",
    "Navigate to target first",
]

[scenarios.setup]
file_content = """fn process() {
    let vallue = 42;
    return value;
}"""
cursor_position = [1, 10]

[scenarios.target]
file_content = """fn process() {
    let value = 42;
    return value;
}"""
cursor_position = [1, 10]

[scenarios.solution]
commands = ["d"]
description = "Press 'd' to delete the extra 'l'"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "editing"
difficulty = "beginner"
tags = ["delete", "selection"]
commands_taught = ["d"]
estimated_time_seconds = 5

[[scenarios]]
id = "delete_line_001"
name = "Delete entire line"
description = "Use 'xd' to delete current line (select + delete)"

hints = [
    "'x' selects the current line",
    "'d' deletes the selection",
    "In Helix, use 'xd' to delete a line",
]

[scenarios.setup]
file_content = """fn main() {
    let x = 1;
    let y = 2;
    let z = 3;
}"""
cursor_position = [2, 4]

[scenarios.target]
file_content = """fn main() {
    let x = 1;
    let z = 3;
}"""
cursor_position = [2, 0]

[scenarios.solution]
commands = ["x", "d"]
description = "Press 'x' to select line, then 'd' to delete"

[scenarios.scoring]
optimal_count = 2
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "editing"
difficulty = "beginner"
tags = ["delete", "line", "selection"]
commands_taught = ["x", "d"]
estimated_time_seconds = 5

