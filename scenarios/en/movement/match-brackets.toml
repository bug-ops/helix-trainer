# Match Brackets Command
# Scenarios for m (match brackets) command

[[scenarios]]
id = "match_brackets_001"
name = "Jump to matching parenthesis"
description = "Use 'm' to jump from opening to closing parenthesis"

hints = [
    "'m' jumps between matching bracket pairs",
    "Works with (), [], {}, and <>",
]

[scenarios.setup]
file_content = "fn foo(x: i32)"
cursor_position = [0, 6]

[scenarios.target]
file_content = "fn foo(x: i32)"
cursor_position = [0, 13]

[scenarios.solution]
commands = ["m"]
description = "Press 'm' to jump to matching ')'"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "movement"
difficulty = "intermediate"
tags = ["brackets", "navigation", "code"]
commands_taught = ["m"]
estimated_time_seconds = 5

[[scenarios]]
id = "match_brackets_002"
name = "Jump back to opening bracket"
description = "Use 'm' to jump from closing to opening bracket"

hints = [
    "'m' works in both directions",
    "From ')' it jumps to '('",
]

[scenarios.setup]
file_content = "{ let x = (1 + 2); }"
cursor_position = [0, 16]

[scenarios.target]
file_content = "{ let x = (1 + 2); }"
cursor_position = [0, 10]

[scenarios.solution]
commands = ["m"]
description = "Press 'm' to jump to matching '('"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "movement"
difficulty = "intermediate"
tags = ["brackets", "navigation", "code"]
commands_taught = ["m"]
estimated_time_seconds = 5

[[scenarios]]
id = "match_brackets_003"
name = "Navigate nested brackets"
description = "Jump between matching braces in nested code"

hints = [
    "'m' handles nested brackets correctly",
    "It finds the true matching bracket",
]

[scenarios.setup]
file_content = "if (a && (b || c)) {"
cursor_position = [0, 3]

[scenarios.target]
file_content = "if (a && (b || c)) {"
cursor_position = [0, 17]

[scenarios.solution]
commands = ["m"]
description = "Press 'm' to jump to outer closing ')'"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "movement"
difficulty = "intermediate"
tags = ["brackets", "nested", "navigation"]
commands_taught = ["m"]
estimated_time_seconds = 10

[[scenarios]]
id = "match_brackets_004"
name = "Jump to matching curly brace"
description = "Use 'm' to navigate between curly braces"

hints = [
    "'m' works with {} curly braces too",
    "Great for navigating function/block boundaries",
]

[scenarios.setup]
file_content = "fn main() {\n    println!(\"Hi\");\n}"
cursor_position = [0, 10]

[scenarios.target]
file_content = "fn main() {\n    println!(\"Hi\");\n}"
cursor_position = [2, 0]

[scenarios.solution]
commands = ["m"]
description = "Press 'm' to jump to closing '}'"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "movement"
difficulty = "intermediate"
tags = ["brackets", "braces", "navigation"]
