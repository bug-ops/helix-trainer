# Find/Till Character Commands
# Scenarios for f, F, t, T (find and till character movements)

[[scenarios]]
id = "find_char_001"
name = "Find next character"
description = "Use 'f' to jump to the next occurrence of a character"

hints = [
    "'f' followed by a character jumps to that character",
    "Press 'f' then the character you want to find",
]

[scenarios.setup]
file_content = """fn main() {
    let result = 42;
    println!("{}", result);
}"""
cursor_position = [1, 4]

[scenarios.target]
file_content = """fn main() {
    let result = 42;
    println!("{}", result);
}"""
cursor_position = [1, 15]

[scenarios.solution]
commands = ["f="]
description = "Press 'f=' to find the '=' character"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "movement"
difficulty = "intermediate"
tags = ["find", "character", "navigation"]
commands_taught = ["f"]
estimated_time_seconds = 10

[[scenarios]]
id = "find_char_002"
name = "Find character in code"
description = "Jump to a specific character in a line of code"

hints = [
    "'f' searches forward on the current line only",
    "Useful for quickly navigating to punctuation",
]

[scenarios.setup]
file_content = """fn process(data: &str) -> Result<i32, Error> {
    Ok(42)
}"""
cursor_position = [0, 0]

[scenarios.target]
file_content = """fn process(data: &str) -> Result<i32, Error> {
    Ok(42)
}"""
cursor_position = [0, 45]

[scenarios.solution]
commands = ["f{"]
description = "Press 'f{' to jump to opening brace"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "movement"
difficulty = "intermediate"
tags = ["find", "code", "navigation"]
commands_taught = ["f"]
estimated_time_seconds = 10

[[scenarios]]
id = "find_prev_char_001"
name = "Find previous character"
description = "Use 'F' to jump to a previous occurrence of a character"

hints = [
    "'F' (capital) searches backward",
    "Useful when you've gone past your target",
]

[scenarios.setup]
file_content = """fn add(a: i32, b: i32) -> i32 {
    a + b
}"""
cursor_position = [0, 20]

[scenarios.target]
file_content = """fn add(a: i32, b: i32) -> i32 {
    a + b
}"""
cursor_position = [0, 16]

[scenarios.solution]
commands = ["F:"]
description = "Press 'F:' to find previous ':'"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "movement"
difficulty = "intermediate"
tags = ["find", "backward", "navigation"]
commands_taught = ["F"]
estimated_time_seconds = 10

[[scenarios]]
id = "till_char_001"
name = "Till next character"
description = "Use 't' to move just before a character"

hints = [
    "'t' moves to one position BEFORE the character",
    "Useful for operations that shouldn't include the target",
]

[scenarios.setup]
file_content = """let items = vec![1, 2, 3];
let sum = items.iter().sum();"""
cursor_position = [0, 4]

[scenarios.target]
file_content = """let items = vec![1, 2, 3];
let sum = items.iter().sum();"""
cursor_position = [0, 9]

[scenarios.solution]
commands = ["t="]
description = "Press 't=' to move just before the '='"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "movement"
difficulty = "intermediate"
tags = ["till", "character", "navigation"]
commands_taught = ["t"]
estimated_time_seconds = 10

[[scenarios]]
id = "till_prev_char_001"
name = "Till previous character"
description = "Use 'T' to move just after a previous character"

hints = [
    "'T' (capital) searches backward",
    "Stops one position AFTER the found character",
]

[scenarios.setup]
file_content = """fn calculate(x: i32, y: i32) -> i32 {
    x * y
}"""
cursor_position = [0, 25]

[scenarios.target]
file_content = """fn calculate(x: i32, y: i32) -> i32 {
    x * y
}"""
cursor_position = [0, 20]

[scenarios.solution]
commands = ["T,"]
description = "Press 'T,' to move just after the comma"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "movement"
difficulty = "intermediate"
tags = ["till", "backward", "navigation"]
commands_taught = ["T"]
estimated_time_seconds = 10
