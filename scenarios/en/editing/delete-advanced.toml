# Advanced Deletion Scenarios
# More complex deletion operations

[[scenarios]]
id = "delete_multi_char_001"
name = "Delete three characters"
description = "Remove multiple characters one by one"

hints = [
    "'x' deletes one character at cursor",
    "Repeat for multiple deletions",
]

[scenarios.setup]
file_content = "Helllo"
cursor_position = [0, 3]

[scenarios.target]
file_content = "Hello"
cursor_position = [0, 3]

[scenarios.solution]
commands = ["x"]
description = "Press 'x' to delete extra 'l'"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "editing"
difficulty = "beginner"
tags = ["delete", "character"]
commands_taught = ["x"]
estimated_time_seconds = 5

