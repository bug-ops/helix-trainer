# Configuration for cargo-deny
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Deny crates with security vulnerabilities
version = 2
ignore = [
    # bincode is unmaintained but it's a transitive dependency of syntect
    # (bincode -> syntect -> helix-trainer); syntect is actively maintained
    # and will update when it moves off bincode
    "RUSTSEC-2025-0141",
]

[licenses]
# List of explicitly allowed licenses
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
# Confidence threshold for license detection
confidence-threshold = 0.8

[bans]
# Deny multiple versions of the same crate
multiple-versions = "warn"
# Deny wildcard dependencies
wildcards = "allow"
# List of crates that are allowed to have multiple versions
skip = [
    # windows_x86_64_{gnu,gnullvm,msvc} fan out to 3 versions each from two
    # independent transitive chains: rodio -> cpal -> jni -> windows-sys 0.45
    # (via windows-targets 0.42) and helix-core/helix-loader -> etcetera ->
    # windows-sys 0.59/0.60 (via windows-targets 0.52/0.53). Neither chain is
    # a direct dependency; re-check after routine `cargo update` whether
    # upstream alignment collapses these.
    { name = "windows_x86_64_gnu" },
    { name = "windows_x86_64_gnullvm" },
    { name = "windows_x86_64_msvc" },
    # winnow duplicates via toml 0.8 (used by helix-core/helix-loader and
    # rust-i18n-support) vs toml 1.x (used directly by helix-trainer and by
    # cpal's ndk -> num_enum chain). Not collapsible without a toml major
    # version alignment upstream.
    { name = "winnow" },
]
# List of explicitly banned crates
deny = []

[sources]
# Deny crates from unknown registries
unknown-registry = "deny"
# Deny crates from git repositories
unknown-git = "deny"
# Allow crates from these git repositories
allow-git = [
    "https://github.com/helix-editor/helix",
]
