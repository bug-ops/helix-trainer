# Basic Character Movement
# Simple h, j, k, l navigation scenarios

[[scenarios]]
id = "move_left_basic_001"
name = "Move left one character"
description = "Move cursor left using 'h'"

hints = [
    "'h' moves cursor left by one character",
    "This is the most basic left movement",
]

[scenarios.setup]
file_content = """fn process_data(input: &str) -> Result<i32, Error> {
    let mut counter = 0;
    let items: Vec<_> = input.lines().collect();

    for line in items.iter() {
        counter += 1;
    }

    Ok(counter)
}"""
cursor_position = [1, 12]

[scenarios.target]
file_content = """fn process_data(input: &str) -> Result<i32, Error> {
    let mut counter = 0;
    let items: Vec<_> = input.lines().collect();

    for line in items.iter() {
        counter += 1;
    }

    Ok(counter)
}"""
cursor_position = [1, 11]

[scenarios.solution]
commands = ["h"]
description = "Press 'h' to move left"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "movement"
difficulty = "beginner"
tags = ["character", "basic"]
commands_taught = ["h"]
estimated_time_seconds = 5

