line 30"""
cursor_position = [12, 5]

[scenarios.solution]
commands = ["Ctrl-d"]
description = "Press 'Ctrl-d' to scroll half a page down"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "movement"
difficulty = "intermediate"
tags = ["scroll", "page", "viewport"]
commands_taught = ["Ctrl-d"]

