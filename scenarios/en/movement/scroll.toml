# Scrolling / Page Movement
# Scenarios for Ctrl-d, Ctrl-u, Ctrl-f, Ctrl-b (half-page/page movement)
# NOTE: scrolling follows hx 25.07.1 on a fixed logical view of 24 lines (the
# terminal height is not used). Ctrl-d / Ctrl-u scroll the view by 12 lines and
# move the cursor the same distance, keeping its column. Ctrl-f / Ctrl-b scroll
# the view by 24 lines and move the cursor only when the view leaves it behind
# the 5-line scrolloff band, to column 0 of the band's edge line.

[[scenarios]]
id = "scroll_half_page_down_001"
name = "Scroll half page down"
description = "Use 'Ctrl-d' to move the cursor down half a page"

hints = [
    "'Ctrl-d' moves the cursor down 12 lines, half of the 24-line view",
    "The column position is preserved when possible",
]

[scenarios.setup]
file_content = """line 01
line 02
line 03
line 04
line 05
line 06
line 07
line 08
line 09
line 10
line 11
line 12
line 13
line 14
line 15
line 16
line 17
line 18
line 19
line 20
line 21
line 22
line 23
line 24
line 25
line 26
line 27
line 28
line 29
line 30"""
cursor_position = [0, 5]

[scenarios.target]
