# Basic Insert Operations
# Scenarios covering various insert modes and line operations

[[scenarios]]
id = "append_mode_001"
name = "Append after word"
description = "Move to end of word and enter insert mode to append text"

hints = [
    "'a' enters insert mode after the cursor position",
    "Don't forget to press Escape to exit insert mode",
]

[scenarios.setup]
file_content = """fn process_data(input: &str) -> Result<i32, Error> {
    let mut counter = 0;
    let items: Vec<_> = input.lines().collect();

    for line in items.iter() {
        counter += 1;
    }

    Ok(counter)
}"""
cursor_position = [1, 8]

[scenarios.target]
file_content = """fn process_data(input: &str) -> Result<i32, Error> {
    let mut counter: i32 = 0;
    let items: Vec<_> = input.lines().collect();

    for line in items.iter() {
        counter += 1;
    }

    Ok(counter)
}"""
cursor_position = [1, 22]

[scenarios.solution]
commands = ["e", "a", ":", " ", "i", "3", "2", "Escape"]
description = "Press 'e' to move to end of 'counter', 'a' to append, type ': i32', Escape to exit"

[scenarios.scoring]
optimal_count = 8
max_points = 100
tolerance = 2

[scenarios.metadata]
category = "editing"
difficulty = "beginner"
tags = ["insert", "append", "word"]
commands_taught = ["e", "a"]
estimated_time_seconds = 25

[[scenarios]]
id = "open_below_001"
name = "Insert line below"
description = "Open a new line below the current line"

hints = ["'o' inserts a new line below and enters insert mode"]

[scenarios.setup]
file_content = """fn calculate_total(prices: &[f64]) -> f64 {
    let mut total = 0.0;

    for price in prices {
        total += price;
    }

    total
}"""
cursor_position = [1, 4]

[scenarios.target]
file_content = """fn calculate_total(prices: &[f64]) -> f64 {
    let mut total = 0.0;
    let discount = 0.1;

    for price in prices {
        total += price;
    }

    total
}"""
cursor_position = [2, 22]

[scenarios.solution]
commands = ["o", " ", " ", " ", " ", "l", "e", "t", " ", "d", "i", "s", "c", "o", "u", "n", "t", " ", "=", " ", "0", ".", "1", ";", "Escape"]
description = "Press 'o' to open a new line below, type the new variable declaration, then Escape"

[scenarios.scoring]
optimal_count = 25
max_points = 100
tolerance = 2

[scenarios.metadata]
category = "editing"
difficulty = "beginner"
tags = ["insert", "line", "open"]
commands_taught = ["o"]
estimated_time_seconds = 30

