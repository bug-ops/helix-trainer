[[scenarios]]
id = "move_left_multiple_001"
name = "Move left three times"
description = "Move cursor left multiple characters using count prefix"

hints = [
    "Use count prefix: '<number><command>' executes command N times",
    "'3h' moves cursor left 3 times",
]

[scenarios.setup]
file_content = """fn validate(data: &Data) -> bool {
    let name = data.get("name").unwrap_or("default");
    let items = [1, 2, 3, 4, 5];

    if name.len() > 0 && items.contains(&data.id) {
        println!("Valid: {}", name);
        return true;
    }
    false
}"""
cursor_position = [1, 15]

[scenarios.target]
file_content = """fn validate(data: &Data) -> bool {
    let name = data.get("name").unwrap_or("default");
    let items = [1, 2, 3, 4, 5];

    if name.len() > 0 && items.contains(&data.id) {
        println!("Valid: {}", name);
        return true;
    }
    false
}"""
cursor_position = [1, 12]

[scenarios.solution]
commands = ["3h"]
description = "Press '3h' to move left 3 times"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "movement"
difficulty = "beginner"
tags = ["character", "multiple", "count"]
