# Word Movement Operations
# Scenarios covering word-level navigation

[[scenarios]]
id = "word_movement_001"
name = "Navigate by words"
description = "Move cursor forward through words to reach the target position"

hints = [
    "'w' moves to the start of the next word",
    "'b' moves backwards to the start of the previous word",
    "'e' moves to the end of the current/next word",
]

[scenarios.setup]
file_content = """fn process_data(input: &str) -> Result<i32, Error> {
    let mut counter = 0;
    let items: Vec<_> = input.lines().collect();

    for line in items.iter() {
        counter += 1;
    }

    Ok(counter)
}"""
cursor_position = [1, 4]

[scenarios.target]
file_content = """fn process_data(input: &str) -> Result<i32, Error> {
    let mut counter = 0;
    let items: Vec<_> = input.lines().collect();

    for line in items.iter() {
        counter += 1;
    }

    Ok(counter)
}"""
cursor_position = [1, 20]
selection = [1, 12, 1, 20]

[scenarios.solution]
commands = ["w", "w", "w"]
description = "Press 'w' three times to move forward by words"

[scenarios.scoring]
optimal_count = 3
max_points = 100
tolerance = 1

[scenarios.metadata]
category = "movement"
difficulty = "beginner"
tags = ["word", "navigation"]
commands_taught = ["w"]
estimated_time_seconds = 20
