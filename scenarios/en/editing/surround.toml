# ============================================================================
# REPLACE SURROUND (mr{from}{to})
# ============================================================================

[[scenarios]]
id = "surround_replace_parens_to_brackets_001"
name = "Replace parentheses with brackets"
description = "Use 'mr([' to change () to []"

hints = [
    "'mr' enters replace mode, then type FROM and TO characters",
    "'mr([' replaces ( ) with [ ]",
]

[scenarios.setup]
file_content = """fn call(x, y)"""
cursor_position = [0, 9]

[scenarios.target]
file_content = """fn call[x, y]"""
cursor_position = [0, 9]

[scenarios.solution]
commands = ["mr(["]
description = "Press 'mr([' to change parens to brackets"

[scenarios.scoring]
optimal_count = 4
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "editing"
difficulty = "intermediate"
tags = ["surround", "replace", "conversion"]
commands_taught = ["mr"]
estimated_time_seconds = 15

