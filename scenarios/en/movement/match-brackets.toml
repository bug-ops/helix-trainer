# Match Brackets Command
# Scenarios for mm (match brackets) command in Match Mode

[[scenarios]]
id = "match_brackets_001"
name = "Jump to matching parenthesis"
description = "Use 'mm' to jump from opening to closing parenthesis"

hints = [
    "'m' enters Match mode, then 'm' again jumps to matching bracket",
    "Works with (), [], {}, and <>",
]

[scenarios.setup]
file_content = """fn calculate(x: i32, y: i32) -> i32 {
    (x + y) * 2
}"""
cursor_position = [0, 12]

[scenarios.target]
file_content = """fn calculate(x: i32, y: i32) -> i32 {
    (x + y) * 2
}"""
cursor_position = [0, 27]

[scenarios.solution]
commands = ["mm"]
description = "Press 'mm' to jump to matching ')'"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "movement"
difficulty = "intermediate"
tags = ["brackets", "navigation", "code", "match-mode"]
commands_taught = ["mm"]
estimated_time_seconds = 5

