name: Code Coverage

# Minimal permissions for security best practices
permissions:
  contents: read
  # All other permissions are implicitly set to none

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0  # Disable incremental compilation for better sccache performance

jobs:
  coverage:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-
            ${{ runner.os }}-cargo-

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Generate coverage report
        run: |
          cargo llvm-cov --all-features --workspace --lcov \
            --output-path lcov.info nextest --lib --verbose

      - name: Generate doc test coverage
        run: |
          cargo llvm-cov --all-features --workspace --lcov \
            --output-path lcov-doctests.info --doc --verbose

      - name: Merge coverage reports
        run: |
          cargo llvm-cov --no-run --lcov --output-path lcov-merged.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info,lcov-doctests.info
          fail_ci_if_error: true
          verbose: true
          flags: unittests
          name: helix-trainer-coverage

      - name: Archive coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: |
            lcov.info
            lcov-doctests.info
          retention-days: 30

      - name: Show sccache statistics
        shell: bash
        run: sccache --show-stats
