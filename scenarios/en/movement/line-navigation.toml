[[scenarios]]
id = "document_start_001"
name = "Jump to document start"
description = "Use 'gg' to go to first line"

hints = [
    "'gg' goes to first line of file",
    "Double tap 'g' quickly",
]

[scenarios.setup]
file_content = """fn process_data(input: &str) -> Result<i32, Error> {
    let mut counter = 0;
    let items: Vec<_> = input.lines().collect();

    for line in items.iter() {
        counter += 1;
    }

    Ok(counter)
}"""
cursor_position = [8, 4]

[scenarios.target]
file_content = """fn process_data(input: &str) -> Result<i32, Error> {
    let mut counter = 0;
    let items: Vec<_> = input.lines().collect();

    for line in items.iter() {
        counter += 1;
    }

    Ok(counter)
}"""
cursor_position = [0, 0]

[scenarios.solution]
commands = ["gg"]
description = "Press 'gg' to go to start"

[scenarios.scoring]
optimal_count = 2
max_points = 100
tolerance = 0

