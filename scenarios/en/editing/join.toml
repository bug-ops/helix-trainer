# Line Join Operations
# Scenarios covering joining lines

[[scenarios]]
id = "join_lines_001"
name = "Join two lines"
description = "Join the current line with the line below"

hints = [
    "'J' joins the current line with the next line",
    "A space is automatically added between the joined lines",
]

[scenarios.setup]
file_content = """fn main() {
    let msg = "Hello"
        .to_string();
}"""
cursor_position = [1, 4]

[scenarios.target]
file_content = """fn main() {
    let msg = "Hello"         .to_string();
}"""
cursor_position = [1, 4]

[scenarios.solution]
commands = ["J"]
description = "Press 'J' to join lines"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "editing"
difficulty = "beginner"
tags = ["join", "lines"]
commands_taught = ["J"]
estimated_time_seconds = 10
