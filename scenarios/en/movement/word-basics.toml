# Word Movement Basics
# Scenarios for w, b navigation

[[scenarios]]
id = "word_forward_basic_001"
name = "Move forward one word"
description = "Use 'w' to jump to next word start"

hints = [
    "'w' moves to the start of the next word",
    "Spaces and punctuation separate words",
]

[scenarios.setup]
file_content = """fn calculate_total(prices: &[f64]) -> f64 {
    let mut total = 0.0;
    let discount = 0.1;

    for price in prices {
        total += price;
    }

    total * (1.0 - discount)
}"""
cursor_position = [1, 4]

[scenarios.target]
file_content = """fn calculate_total(prices: &[f64]) -> f64 {
    let mut total = 0.0;
    let discount = 0.1;

    for price in prices {
        total += price;
    }

    total * (1.0 - discount)
}"""
cursor_position = [1, 8]
selection = [1, 4, 1, 8]

[scenarios.solution]
commands = ["w"]
description = "Press 'w' to move to next word"

[scenarios.scoring]
optimal_count = 1
max_points = 100
tolerance = 0

[scenarios.metadata]
category = "movement"
difficulty = "beginner"
tags = ["word", "forward"]
commands_taught = ["w"]
estimated_time_seconds = 5

